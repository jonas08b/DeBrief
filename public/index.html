<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>DeBrief</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap');

  @font-face {
    font-family: 'Roobert';
    src: url('Roobert-Regular.woff') format('woff');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Roobert';
    src: url('Roobert-Bold.woff') format('woff');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --bg: #101417;
    --bg-card: #1a1e22;
    --bg-card2: #1f2428;
    --ink: #ffffff;
    --ink-muted: #888888;
    --ink-faint: #444444;
    --accent: #C8311A;
    --border: #2a2e32;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --font-sans: 'Roobert','DM Sans',-apple-system,system-ui,sans-serif;
    --font-serif: 'DM Serif Display','Georgia',serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; -webkit-text-size-adjust: 100%; width: 100%; overflow-x: hidden; scrollbar-width: none; }
  html::-webkit-scrollbar { display: none; }

  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    overscroll-behavior: none;
    width: 100%;
    max-width: 100vw;
    overflow-x: hidden;
    scrollbar-width: none;
  }
  body::-webkit-scrollbar { display: none; }

  /* ── HEADER ── */
  .header {
    position: sticky; top: 0; left: 0; right: 0; z-index: 100;
    width: 100%; max-width: 100vw; overflow: hidden;
    background: var(--bg);
    padding: calc(var(--safe-top) + 14px) 20px 0;
  }
  .header-top {
    display: flex; align-items: center;
    justify-content: space-between; padding-bottom: 12px;
  }
  /* Logo: "De" wit, "Brief" wit — maar in de foto is het "De" wit en "Brief" rood */
  .logo {
    font-family: var(--font-serif);
    font-size: 30px;
    letter-spacing: -.5px;
    line-height: 1;
    color: var(--ink);
  }
  .logo span { color: var(--accent); }

  .header-actions { display: flex; align-items: center; gap: 8px; }

  .header-icon-btn {
    width: 38px; height: 38px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: none; border: none; cursor: pointer;
    color: var(--ink-muted); transition: color .15s;
    -webkit-tap-highlight-color: transparent;
    text-decoration: none;
  }
  .header-icon-btn:hover { color: var(--ink); }
  .header-icon-btn svg {
    width: 22px; height: 22px; stroke: currentColor; fill: none;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  }
  .header-date {
    font-size: 14px; font-weight: 400; color: var(--ink-muted);
    letter-spacing: .01em; white-space: nowrap;
    text-transform: capitalize;
  }

  /* ── SOURCE ROW ── */
  .source-row-wrap {
    overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
    padding: 0 0 14px;
  }
  .source-row-wrap::-webkit-scrollbar { display: none; }
  .source-row { display: flex; gap: 8px; width: max-content; padding: 0 0px; }

  .source-chip {
    font-size: 13px; font-weight: 500;
    padding: 7px 16px; border-radius: 20px;
    border: 1.5px solid #333; background: transparent; color: #999;
    cursor: pointer; white-space: nowrap; transition: all .15s;
    -webkit-tap-highlight-color: transparent;
  }
  /* Actieve chip: witte achtergrond, zwarte tekst — exact zoals de foto */
  .source-chip.active {
    background: #ffffff; border-color: #ffffff; color: #000000; font-weight: 600;
  }

  /* "Meer" chip met pijltje */
  .source-chip-meer {
    display: flex; align-items: center; gap: 4px;
  }
  .source-chip-meer svg {
    width: 12px; height: 12px; stroke: currentColor; fill: none;
    stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
  }

  /* ── FEED ── */
  .feed {
    padding: 0 0 calc(var(--safe-bottom) + 80px);
    max-width: 680px; margin: 0 auto;
  }

  /* ── STATUS ── */
  .status-screen {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 50vh; gap: 14px; color: var(--ink-muted);
  }
  .spinner {
    width: 28px; height: 28px; border: 2px solid #333;
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .load-msg { font-size: 13px; color: var(--ink-muted); }

  /* ── TOP STORY ── */
  .top-story {
    display: block; text-decoration: none; color: inherit;
    margin-bottom: 0;
    -webkit-tap-highlight-color: transparent;
    transition: opacity .18s;
    animation: fadeUp .3s ease both;
    cursor: pointer;
  }
  .top-story:active { opacity: .88; }

  .top-story-img-wrap {
    position: relative;
    margin: 0 16px;
    border-radius: 16px;
    overflow: hidden;
  }
  .top-story-img {
    width: 100%; height: 300px; object-fit: cover; display: block;
    background: #222;
  }
  .top-story-img-overlay {
    position: absolute; bottom: 0; left: 0; right: 0; height: 60%;
    background: linear-gradient(to bottom, transparent, rgba(0,0,0,.6));
    pointer-events: none;
  }
  .top-story-cat-pill {
    position: absolute; bottom: 14px; left: 14px;
    font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
    padding: 4px 10px; border-radius: 6px;
    background: var(--accent); color: #fff;
  }

  .top-story-body { padding: 14px 20px 20px; }
  .top-story h2 {
    font-family: var(--font-serif); font-size: 26px; line-height: 1.2;
    letter-spacing: -.3px; color: var(--ink); margin-bottom: 10px;
  }
  .top-story-desc {
    font-size: 14px; line-height: 1.55; color: var(--ink-muted); margin-bottom: 12px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .top-story-source-row {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--ink-muted);
  }

  /* ── MEER NIEUWS SECTIE ── */
  .section-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 20px 12px;
  }
  .section-head h3 {
    font-size: 17px; font-weight: 700; color: var(--ink);
  }
  /* "Bekijk alles 39" knop — donker met rood badge */
  .bekijk-alles-btn {
    display: flex; align-items: center; gap: 6px;
    background: #1c1c1c; border: none; border-radius: 20px;
    padding: 5px 6px 5px 12px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    font-family: var(--font-sans); font-size: 13px; font-weight: 500;
    color: var(--ink);
  }
  .bekijk-alles-count {
    background: var(--accent); color: #fff;
    font-size: 12px; font-weight: 700;
    padding: 2px 8px; border-radius: 12px;
    min-width: 24px; text-align: center;
  }

  /* ── ARTICLE CARD ── */
  .article-card {
    display: flex; text-decoration: none; color: inherit;
    background: var(--bg-card);
    border-radius: 14px; overflow: hidden;
    margin: 0 16px 10px; min-height: 100px;
    -webkit-tap-highlight-color: transparent;
    transition: opacity .15s;
    animation: fadeUp .3s ease both;
    cursor: pointer;
  }
  .article-card:active { opacity: .75; }
  .article-card.seen { opacity: .45; }

  .article-card-img {
    width: 110px; min-width: 110px; height: 110px;
    object-fit: cover; flex-shrink: 0; background: #222;
  }
  .article-card-placeholder {
    width: 110px; min-width: 110px; height: 110px; flex-shrink: 0;
    background: #1a1a1a;
  }
  .article-card-body {
    padding: 12px 14px; flex: 1; display: flex;
    flex-direction: column; justify-content: space-between; min-width: 0;
  }
  .article-card h3 {
    font-size: 15px; font-weight: 600; line-height: 1.35; color: var(--ink);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden; margin-bottom: 8px;
  }
  .article-card.seen h3 { color: var(--ink-muted); }

  /* ── BOOKMARK BTN ── */
  .bm-btn {
    background: none; border: none; padding: 2px; cursor: pointer;
    color: var(--ink-faint); line-height: 0; flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
    transition: color .15s, transform .15s;
    margin-left: auto;
  }
  .bm-btn:active { transform: scale(.85); }
  .bm-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .bm-btn.saved { color: var(--accent); }
  .bm-btn.saved svg { fill: var(--accent); }

  /* ── META ROW ── */
  .meta-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .source-time { font-size: 12px; color: var(--ink-muted); white-space: nowrap; }

  /* ── CATEGORIE LABELS — exact zoals foto ── */
  /* BINNENLAND: groene tekst, donkergroene achtergrond, afgerond */
  .label-binnenland {
    font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 5px; white-space: nowrap;
    background: #0d2e1a; color: #4ade80;
  }
  /* BUITENLAND: blauwe tekst, donkerblauwe achtergrond */
  .label-buitenland {
    font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 5px; white-space: nowrap;
    background: #0d1e3a; color: #60a5fa;
  }
  /* POLITIEK: paarse tint */
  .label-politiek {
    font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 5px; white-space: nowrap;
    background: #1e0d38; color: #c084fc;
  }
  /* ECONOMIE: oranje/amber tint */
  .label-economie {
    font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 5px; white-space: nowrap;
    background: #2a1500; color: #fb923c;
  }

  /* Regio vlag emoji */
  .flag { font-size: 14px; }

  /* ── TAB BAR — exact zoals foto ── */
  .tab-bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
    background: #000000;
    border-top: 1px solid #222;
    display: flex; align-items: stretch;
    padding-bottom: var(--safe-bottom);
  }
  .tab {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 4px;
    padding: 10px 2px 8px; border: none; background: none;
    color: #555;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: color .15s; min-width: 0;
  }
  .tab svg {
    width: 24px; height: 24px; stroke: currentColor; fill: none;
    stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
  }
  /* Voorpagina actief: rood fill vierkantjes icoon + rode tekst */
  .tab.active { color: var(--accent); }
  .tab.active svg { stroke-width: 2; }
  .tab-label {
    font-size: 10px; font-weight: 500; letter-spacing: .01em;
    white-space: nowrap; color: inherit; line-height: 1;
  }

  /* ── OPGESLAGEN PANEL ── */
  .opgeslagen-panel {
    display: none; max-width: 680px; margin: 0 auto;
    padding: 0 0 calc(var(--safe-bottom) + 80px);
  }
  .opgeslagen-panel.visible { display: block; }
  .opgeslagen-empty { text-align: center; padding: 60px 20px; color: var(--ink-muted); }
  .opgeslagen-empty .icon { font-size: 40px; display: block; margin-bottom: 12px; }
  .opgeslagen-empty p { font-size: 15px; line-height: 1.5; }

  /* ── PROGRESS BAR ── */
  .progress-bar {
    position: fixed; top: 0; left: 0; height: 2px;
    background: var(--accent); width: 0%; z-index: 999;
    transition: width .25s ease;
  }

  /* ── PULL TO REFRESH ── */
  .ptr-indicator {
    display: flex; align-items: center; justify-content: center;
    height: 0; overflow: hidden; transition: height .2s ease;
    color: var(--ink-muted); font-size: 12px; gap: 8px;
  }
  .ptr-indicator.visible { height: 48px; }
  .ptr-spinner {
    width: 18px; height: 18px; border: 2px solid #333;
    border-top-color: var(--accent); border-radius: 50%;
  }
  .ptr-spinner.spinning { animation: spin .8s linear infinite; }

  /* ── ERROR ── */
  .error-banner {
    background: #1a0808; border: 1px solid #3a1010;
    border-radius: 12px; padding: 10px 14px;
    font-size: 12px; color: #f87171; margin: 0 16px 12px;
  }

  /* ── EMPTY ── */
  .empty-state { text-align: center; padding: 48px 24px; color: var(--ink-muted); }
  .empty-state .icon { font-size: 36px; margin-bottom: 12px; display: block; }
  .empty-state p { font-size: 14px; line-height: 1.6; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .article-card:nth-child(2) { animation-delay:.05s }
  .article-card:nth-child(3) { animation-delay:.10s }
  .article-card:nth-child(4) { animation-delay:.15s }
  .article-card:nth-child(5) { animation-delay:.20s }
  .article-card:nth-child(6) { animation-delay:.25s }

  /* ── POPUP ── */
  .popup-overlay {
    position: fixed; inset: 0; z-index: 300;
    background: rgba(0,0,0,.6);
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease;
  }
  .popup-overlay.open { opacity: 1; pointer-events: all; }
  .popup-sheet {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 301;
    background: #111;
    border-radius: 20px 20px 0 0;
    padding: 0 0 calc(var(--safe-bottom) + 12px);
    max-height: 80vh; overflow-y: auto;
    transform: translateY(100%);
    transition: transform .3s cubic-bezier(.32,.72,0,1);
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .popup-sheet::-webkit-scrollbar { display: none; }
  .popup-sheet.open { transform: translateY(0); }
  .popup-handle {
    width: 36px; height: 4px; border-radius: 2px;
    background: #333; margin: 12px auto 16px;
  }
  .popup-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px;
  }
  .popup-close {
    width: 30px; height: 30px; border-radius: 50%;
    background: #222; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: #888; font-size: 16px; line-height: 1;
    -webkit-tap-highlight-color: transparent;
  }
  .popup-body { padding: 14px 20px 8px; }
  .popup-title {
    font-family: var(--font-serif); font-size: 20px; line-height: 1.3;
    color: var(--ink); margin-bottom: 10px;
  }
  .popup-desc { font-size: 14px; line-height: 1.65; color: var(--ink-muted); margin-bottom: 20px; }
  .popup-btn {
    display: block; width: 100%; padding: 14px;
    background: #fff; color: #000;
    font-family: var(--font-sans); font-size: 14px; font-weight: 600;
    text-align: center; text-decoration: none;
    border-radius: 12px; border: none; cursor: pointer;
    -webkit-tap-highlight-color: transparent; transition: background .15s;
  }
  .popup-btn:active { background: var(--accent); color: #fff; }

  /* ── DESTEM PANEEL ── */
  .destem-overlay {
    position: fixed; inset: 0; z-index: 400;
    background: rgba(0,0,0,.6);
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease;
  }
  .destem-overlay.open { opacity: 1; pointer-events: all; }
  .destem-sheet {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 401;
    background: #111;
    border-radius: 20px 20px 0 0;
    padding: 0 0 calc(var(--safe-bottom) + 24px);
    transform: translateY(100%);
    transition: transform .3s cubic-bezier(.32,.72,0,1);
  }
  .destem-sheet.open { transform: translateY(0); }
  .destem-handle {
    width: 36px; height: 4px; border-radius: 2px;
    background: #333; margin: 14px auto 0;
  }
  .destem-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px 0;
  }
  .destem-title-row { display: flex; align-items: center; gap: 10px; }
  .destem-logo {
    font-family: var(--font-serif); font-size: 20px;
    letter-spacing: -.3px; line-height: 1; color: var(--ink);
  }
  .destem-logo span { color: var(--accent); }
  .destem-date-label {
    font-size: 11px; font-weight: 500; letter-spacing: .06em;
    text-transform: uppercase; color: #555;
  }
  .destem-generate-btn {
    background: none; border: 1.5px solid #333; border-radius: 50%;
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 16px; color: #666; transition: color .2s, border-color .2s;
    margin-left: 6px;
  }
  .destem-generate-btn:hover { color: var(--accent); border-color: var(--accent); }
  .destem-generate-btn.spinning { animation: destem-spin 1s linear infinite; }
  @keyframes destem-spin { to { transform: rotate(360deg); } }
  .destem-close {
    width: 30px; height: 30px; border-radius: 50%;
    background: #222; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: #888; font-size: 16px; line-height: 1;
    -webkit-tap-highlight-color: transparent;
  }
  .destem-player { padding: 20px 20px 0; }
  .destem-progress-wrap {
    position: relative; height: 4px; border-radius: 2px;
    background: #333; margin-bottom: 10px; cursor: pointer;
  }
  .destem-progress-fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    border-radius: 2px; background: var(--accent);
    width: 0%; pointer-events: none;
  }
  .destem-progress-thumb {
    position: absolute; top: 50%; transform: translate(-50%,-50%);
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); left: 0%;
    box-shadow: 0 0 0 3px #111; pointer-events: none;
  }
  .destem-times {
    display: flex; justify-content: space-between;
    font-size: 11px; color: #555; margin-bottom: 18px;
  }
  .destem-controls {
    display: flex; align-items: center; justify-content: center; gap: 24px;
    margin-bottom: 20px;
  }
  .destem-ctrl {
    background: none; border: none; cursor: pointer;
    color: #666; padding: 6px;
    -webkit-tap-highlight-color: transparent; transition: color .15s;
  }
  .destem-ctrl:hover { color: var(--ink); }
  .destem-ctrl svg {
    width: 22px; height: 22px; stroke: currentColor; fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }
  .destem-play-btn {
    width: 56px; height: 56px; border-radius: 50%;
    background: #fff; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent; transition: background .15s;
  }
  .destem-play-btn:hover { background: var(--accent); }
  .destem-play-btn svg {
    width: 22px; height: 22px; stroke: #000; fill: none;
    stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
  }
  .destem-play-btn.playing svg .play-icon { display: none; }
  .destem-play-btn:not(.playing) svg .pause-icon { display: none; }
  .destem-status {
    text-align: center; font-size: 13px; color: #666;
    min-height: 40px; display: flex; align-items: center;
    justify-content: center; padding: 0 20px; line-height: 1.5;
  }
  .destem-spinner {
    width: 20px; height: 20px; border: 2px solid #333;
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin .7s linear infinite; margin: 0 auto 8px;
  }
  .destem-stories { padding: 4px 20px 0; display: none; }
  .destem-stories.visible { display: block; }
  .destem-story-card {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 11px 0; border-bottom: 1px solid #222;
  }
  .destem-story-card:last-child { border-bottom: none; }
  .destem-story-rank {
    font-family: var(--font-serif); font-size: 22px; line-height: 1;
    color: #444; min-width: 24px; padding-top: 2px; flex-shrink: 0;
  }
  .destem-story-card.rank-1 .destem-story-rank { color: var(--accent); }
  .destem-story-body { flex: 1; min-width: 0; }
  .destem-story-title { font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.4; margin-bottom: 4px; }
  .destem-story-summary { font-size: 12px; color: #666; line-height: 1.5; }
  .destem-story-source {
    font-size: 10px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; color: #444; margin-top: 4px;
  }
  .destem-script {
    margin: 0 20px; padding: 14px 16px;
    background: #0a0a0a; border: 1px solid #222;
    border-radius: 10px; font-size: 13px; line-height: 1.65;
    color: #666; max-height: 200px; overflow-y: auto;
    -webkit-overflow-scrolling: touch; display: none; scrollbar-width: none;
  }
  .destem-script::-webkit-scrollbar { display: none; }
  .destem-script.visible { display: block; }
  .destem-expand-row {
    display: none; align-items: center;
    padding: 10px 20px 0;
  }
  .destem-expand-row.visible { display: flex; }
  .destem-expand-tab {
    background: none; border: none; cursor: pointer;
    font-family: var(--font-sans); font-size: 13px; font-weight: 600;
    color: #555; padding: 4px 0; margin-right: 18px;
    border-bottom: 2px solid transparent;
    -webkit-tap-highlight-color: transparent; transition: color .15s;
  }
  .destem-expand-tab.active { color: var(--ink); border-bottom-color: var(--accent); }
</style>
</head>

  <div class="status-screen">
    <div class="spinner"></div>

<!-- Tab bar — 6 tabs exact zoals foto (zonder Markten) -->
<nav class="tab-bar" id="catTabs">

<!-- Opgeslagen panel -->
<div id="opgeslagenPanel" class="opgeslagen-panel"></div>

<!-- Popup -->
<div class="popup-overlay" id="popupOverlay"></div>

  <div class="popup-header">

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="bm-remove-icon" style="display:none"><path d="m14.5 7.5-5 5"/><path d="M17 3a2 2 0 0 1 2 2v15a1 1 0 0 1-1.496.868l-4.512-2.578a2 2 0 0 0-1.984 0l-4.512 2.578A1 1 0 0 1 5 20V5a2 2 0 0 1 2-2z"/><path d="m9.5 7.5 5 5"/></svg>
    </button>
  </div>

    <div class="popup-title" id="popupTitle"></div>

    <a class="popup-btn" id="popupBtn" href="#" target="_blank" rel="noopener">Lees artikel →</a>
  </div>
</div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────────
const RSS2JSON_BASE = 'https://api.rss2json.com/v1/api.json?api_key=goxrkjvrqv2dqaaj0mybmnl0vyjxhqccxlh906cv&count=100&rss_url=';

const SOURCES = [
  { id:'detijd',    name:'De Tijd',      region:'be', urls:[
      'https://www.tijd.be/rss/nieuws.xml',
      'https://www.tijd.be/rss/politiek.xml',
      'https://www.tijd.be/rss/ondernemen.xml'
  ]},
  { id:'standaard', name:'De Standaard', region:'be', urls:[
      'https://www.standaard.be/binnenland/rss/',
      'https://www.standaard.be/buitenland/rss/',
      'https://www.standaard.be/economie/rss/',
      'https://www.standaard.be/economie/beurs/rss/',
      'https://www.standaard.be/opinies/rss/'
  ]},
  { id:'hln',       name:'HLN',          region:'be', urls:['https://www.hln.be/home/rss.xml'] }
];

// ── POLITIEK KEYWORD CHECK ────────────────────────────────────────────────────
function isPolitiek(title) {
  const t = (title || '').toLowerCase();
  return [
    'verkiezing','verkiezingen','stemmen','kiesdrempel','kieskring',
    'parlement','kamer ','senaat','kamerlid','fractieleider','volksvertegenwoordiger',
    'regering','coalitie','oppositie','premier','minister','staatssecretaris',
    'partij ','politicus','politica','politici',
    'wetgeving','decreet','grondwet','beleid',
    'debat','motie','begroting',
    'gemeenteraad','burgemeester','schepen',
    'referendum','volksraadpleging',
    'diplomatiek','ambassade','ambassadeur',
    'eu-top','g7','g20','navo',
    'kandidaat','lijsttrekker','partijvoorzitter','partijleider',
    'n-va','vlaams belang','cd&v','open vld','vooruit',' ps ',' mr ','pvda','ecolo','groen',
    'trump','macron','scholz','meloni','zelensky','netanyahu','putin',
    'europese commissie','europees parlement','europese raad',
    'veiligheidsraad','eu-beleid','sancties',
    'presidentsverkiezing','presidentieel',
    'election','parliament','congress','senate','prime minister',
    'coalition','opposition','diplomatic','ballot','vote ',
  ].some(w => t.includes(w));
}

// ── CATEGORISATIE ─────────────────────────────────────────────────────────────
function categoriseHLN(url) {
  if (!url) return 'verwijder';
  const u = url.toLowerCase();
  if (/hln\.be\/buitenlands-voetbal/.test(u)) return 'verwijder';
  if (/hln\.be\/binnenland/.test(u)) return 'binnenland';
  if (/hln\.be\/buitenland/.test(u)) return 'buitenland';
  if (/hln\.be\/(economie|geld|tech|wetenschap)/.test(u)) return 'economie';
  if (/hln\.be\/opinie/.test(u)) return 'binnenland';
  return 'verwijder';
}

function categoriseDeStandaard(articleUrl, title) {
  if (!articleUrl) return 'verwijder';
  const u = articleUrl.toLowerCase();
  if (/standaard\.be\/binnenland/.test(u)) return isPolitiek(title) ? 'politiek' : 'binnenland';
  if (/standaard\.be\/buitenland/.test(u)) return isPolitiek(title) ? 'politiek' : 'buitenland';
  if (/standaard\.be\/economie/.test(u))   return 'economie';
  if (/standaard\.be\/opinies/.test(u))    return isPolitiek(title) ? 'politiek' : 'binnenland';
  return 'verwijder';
}

function categoriseDeTijd(feedUrl, title) {
  const f = (feedUrl || '').toLowerCase();
  if (/politiek/.test(f))    return 'politiek';
  if (/ondernemen/.test(f))  return 'economie';
  if (/nieuws/.test(f))      return isPolitiek(title) ? 'politiek' : 'binnenland';
  return 'verwijder';
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function decodeEntities(str) {
  try { return new DOMParser().parseFromString(str, 'text/html').documentElement.textContent; }
  catch { return str; }
}

// Header datum
(function() {
  const el = document.getElementById('headerDate');
  if (!el) return;
  const d = new Date();
  const s = d.toLocaleDateString('nl-BE', { weekday:'long', day:'numeric', month:'long' });
  el.textContent = s.charAt(0).toUpperCase() + s.slice(1);
})();

function timeAgo(ds) {
  if (!ds) return '';
  try {
    const m = (Date.now() - new Date(ds).getTime()) / 60000;
    if (m < 1)    return 'zojuist';
    if (m < 60)   return `${Math.round(m)}m geleden`;
    if (m < 1440) return `${Math.round(m/60)}u geleden`;
    return new Date(ds).toLocaleDateString('nl-BE',{day:'numeric',month:'short'});
  } catch { return ''; }
}

// ── LABELS ────────────────────────────────────────────────────────────────────
const FLAG = { be:'🇧🇪', eu:'🇪🇺', world:'🌍' };
const CAT_LABEL = {
  binnenland: ['label-binnenland','BINNENLAND'],
  buitenland: ['label-buitenland','BUITENLAND'],
  politiek:   ['label-politiek','POLITIEK'],
  economie:   ['label-economie','ECONOMIE'],
};
const cLabel = c => {
  const [cls, txt] = CAT_LABEL[c] || [];
  return txt ? `<span class="${cls}">${txt}</span>` : '';
};
const rLabel = r => FLAG[r] ? `<span class="flag">${FLAG[r]}</span>` : '';

// ── STATE ─────────────────────────────────────────────────────────────────────
let allArticles = [];
let activeTab    = 'alles';
let activeSource = 'alle';

// ── PROGRESS ──────────────────────────────────────────────────────────────────
let _done = 0, _total = 0;
const bar = document.getElementById('progressBar');
function tickProgress() {
  _done++;
  const pct = _total > 0 ? Math.round((_done / _total) * 100) : 100;
  bar.style.width = pct + '%';
  if (_done >= _total) setTimeout(() => { bar.style.width = '0%'; }, 700);
}

// ── FETCH ─────────────────────────────────────────────────────────────────────
async function fetchFeed(feedUrl, meta) {
  const res  = await fetch(RSS2JSON_BASE + encodeURIComponent(feedUrl), { signal: AbortSignal.timeout(10000) });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  if (data.status !== 'ok' || !Array.isArray(data.items)) throw new Error(data.message || 'fout');

  return data.items.map(item => {
    let image = item.thumbnail || item.enclosure?.link || null;
    if (image && /1x1|pixel|track|blank|spacer/i.test(image)) image = null;
    const title   = decodeEntities(decodeEntities((item.title || '').trim()));
    const link    = item.link || item.guid || '';
    const pubDate = item.pubDate || null;
    const desc    = (item.description || item.content || '').trim();

    let cat;
    if (meta.id === 'hln') {
      cat = categoriseHLN(link);
    } else if (meta.id === 'detijd') {
      cat = categoriseDeTijd(feedUrl, title);
    } else if (meta.id === 'standaard') {
      cat = categoriseDeStandaard(link, title);
    } else {
      cat = 'overig';
    }

    if (cat === 'verwijder') return null;
    return { title, link, pubDate, image, cat, desc, source: { name: meta.name, region: meta.region, id: meta.id } };
  }).filter(Boolean);
}

async function loadAll() {
  const tasks = SOURCES.flatMap(src => src.urls.map(url => ({ url, meta: src })));
  _done = 0; _total = tasks.length;
  bar.style.width = '0%';

  const errors = [];
  const settled = await Promise.allSettled(
    tasks.map(t =>
      fetchFeed(t.url, t.meta)
        .then(items => { tickProgress(); return items; })
        .catch(e    => { tickProgress(); errors.push(`${t.meta.name}: ${e.message}`); return []; })
    )
  );

  let arts = settled.flatMap(r => r.status === 'fulfilled' ? r.value : []);

  // Enkel laatste 24u, anders alles
  const recent = arts.filter(a => a.pubDate && (Date.now() - new Date(a.pubDate).getTime()) < 86400000);
  arts = (recent.length > 0 ? recent : arts).sort((a,b) => new Date(b.pubDate||0) - new Date(a.pubDate||0));

  // Dedupliceer
  const seen = new Set();
  allArticles = arts.filter(a => {
    const k = a.title.toLowerCase().replace(/\W/g,'').slice(0,50);
    if (seen.has(k)) return false;
    seen.add(k); return true;
  });

  return errors;
}

// ── FILTER ────────────────────────────────────────────────────────────────────
function filtered() {
  let arts = allArticles;
  if (activeSource !== 'alle') arts = arts.filter(a => a.source.name === activeSource);
  if (activeTab !== 'alles')   arts = arts.filter(a => a.cat === activeTab);
  return arts;
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render(errors = []) {
  const container = document.getElementById('feedContainer');
  const arts = filtered();
  const seenMap = seenLoad();
  let html = '';

  if (errors.length) {
    const names = [...new Set(errors.map(e => e.split(':')[0]))].join(', ');
    html += `<div class="error-banner">⚠️ Kon niet laden: <strong>${names}</strong></div>`;
  }

  if (!arts.length) {
    html += `<div class="empty-state"><span class="icon">📭</span><p>Geen artikels voor deze selectie.</p></div>`;
    container.innerHTML = html; return;
  }

  const [top, ...rest] = arts;
  const topIdx  = allArticles.indexOf(top);
  const topSeen = isSeen(top, seenMap);
  const topCat  = CAT_LABEL[top.cat] ? CAT_LABEL[top.cat][1] : '';

  // Top story
  html += `<div class="top-story${topSeen ? ' seen' : ''}" data-idx="${topIdx}">`;
  if (top.image) {
    html += `<div class="top-story-img-wrap">`;
    html += `<img class="top-story-img" src="${esc(top.image)}" alt="" loading="eager" onerror="this.closest('.top-story-img-wrap').style.display='none'">`;
    html += `<div class="top-story-img-overlay"></div>`;
    if (topCat) html += `<span class="top-story-cat-pill">${topCat}</span>`;
    html += `</div>`;
  }
  html += `<div class="top-story-body">`;
  html += `<h2>${esc(top.title)}</h2>`;
  if (top.desc) {
    const clean = top.desc.replace(/<[^>]*>/g,'').trim();
    if (clean) html += `<div class="top-story-desc">${esc(clean)}</div>`;
  }
  html += `<div class="top-story-source-row">${rLabel(top.source.region)}<span class="source-time">${esc(top.source.name)} · ${timeAgo(top.pubDate)}</span></div>`;
  html += `</div></div>`;

  // Meer nieuws
  if (rest.length) {
    html += `<div class="section-head"><h3>Meer nieuws</h3><button class="bekijk-alles-btn" id="bekijkAllesBtn"><span>Bekijk alles</span><span class="bekijk-alles-count">${rest.length}</span></button></div>`;
  }

  for (const art of rest) {
    const idx   = allArticles.indexOf(art);
    const seen  = isSeen(art, seenMap);
    const saved = bmHas(art);
    html += `<div class="article-card${seen ? ' seen' : ''}" data-idx="${idx}">`;
    if (art.image) {
      html += `<img class="article-card-img" src="${esc(art.image)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'article-card-placeholder'}))">`;
    } else {
      html += `<div class="article-card-placeholder"></div>`;
    }
    html += `<div class="article-card-body">`;
    html += `<h3>${esc(art.title)}</h3>`;
    html += `<div class="meta-row">${cLabel(art.cat)}<span class="source-time">${esc(art.source.name)} · ${timeAgo(art.pubDate)}</span><button class="bm-btn${saved ? ' saved' : ''}" data-bm-idx="${idx}" aria-label="Bewaar">${bmIconHTML(saved)}</button></div>`;
    html += `</div></div>`;
  }

  container.innerHTML = html;
}

// ── SEEN ──────────────────────────────────────────────────────────────────────
const SEEN_KEY = 'debrief_seen_v1';
const SEEN_TTL = 7 * 24 * 60 * 60 * 1000;
function seenLoad() {
  try {
    const raw = JSON.parse(localStorage.getItem(SEEN_KEY) || '{}');
    const now = Date.now();
    for (const k of Object.keys(raw)) if (now - raw[k] > SEEN_TTL) delete raw[k];
    return raw;
  } catch { return {}; }
}
function seenMark(key) {
  try { const r = seenLoad(); r[key] = Date.now(); localStorage.setItem(SEEN_KEY, JSON.stringify(r)); } catch {}
}
function seenKey(art) { return art.link.slice(-60); }
function isSeen(art, m) { return !!m[seenKey(art)]; }

// ── BOOKMARKS ─────────────────────────────────────────────────────────────────
const BMARK_KEY = 'debrief_bookmarks_v1';
function bmLoad() { try { return JSON.parse(localStorage.getItem(BMARK_KEY) || '[]'); } catch { return []; } }
function bmHas(art) { return bmLoad().some(a => a.link === art.link); }
function bmToggle(art) {
  const list = bmLoad();
  const idx  = list.findIndex(a => a.link === art.link);
  if (idx >= 0) list.splice(idx, 1);
  else list.unshift({ ...art, savedAt: Date.now() });
  try { localStorage.setItem(BMARK_KEY, JSON.stringify(list)); } catch {}
  return idx < 0;
}
function bmIconHTML(saved) {
  return saved
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 7.5-5 5"/><path d="M17 3a2 2 0 0 1 2 2v15a1 1 0 0 1-1.496.868l-4.512-2.578a2 2 0 0 0-1.984 0l-4.512 2.578A1 1 0 0 1 5 20V5a2 2 0 0 1 2-2z"/><path d="m9.5 7.5 5 5"/></svg>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2 2 0 0 1 2 2v15a1 1 0 0 1-1.496.868l-4.512-2.578a2 2 0 0 0-1.984 0l-4.512 2.578A1 1 0 0 1 5 20V5a2 2 0 0 1 2-2z"/></svg>`;
}

function renderOpgeslagen() {
  const panel = document.getElementById('opgeslagenPanel');
  const list  = bmLoad();
  if (!list.length) {
    panel.innerHTML = `<div class="opgeslagen-empty"><span class="icon">🔖</span><p>Nog niets opgeslagen.<br>Tik op het bladwijzer-icoon op een artikel.</p></div>`;
    return;
  }
  let html = `<div class="section-head" style="padding:18px 20px 12px"><h3>Opgeslagen</h3><span style="font-size:13px;color:#555">${list.length}</span></div>`;
  for (const art of list) {
    html += `<div class="article-card" data-bm-link="${esc(art.link)}">`;
    if (art.image) {
      html += `<img class="article-card-img" src="${esc(art.image)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'article-card-placeholder'}))">`;
    } else {
      html += `<div class="article-card-placeholder"></div>`;
    }
    html += `<div class="article-card-body">`;
    html += `<h3>${esc(art.title)}</h3>`;
    html += `<div class="meta-row">${cLabel(art.cat)}<span class="source-time">${esc(art.source.name)} · ${timeAgo(art.pubDate)}</span><button class="bm-btn saved" data-bm-link="${esc(art.link)}">${bmIconHTML(true)}</button></div>`;
    html += `</div></div>`;
  }
  panel.innerHTML = html;
}

// ── INIT ──────────────────────────────────────────────────────────────────────
async function init() {
  document.getElementById('feedContainer').innerHTML = `<div class="status-screen"><div class="spinner"></div><div class="load-msg">Nieuws ophalen…</div></div>`;
  const errors = await loadAll();
  if (!allArticles.length) {
    document.getElementById('feedContainer').innerHTML = `<div class="status-screen"><div style="font-size:36px">⚠️</div><div class="load-msg">Kon geen artikels laden. Controleer je verbinding.</div></div>`;
    return;
  }
  render(errors);
}

// ── EVENTS ────────────────────────────────────────────────────────────────────
document.getElementById('feedContainer').addEventListener('click', e => {
  // Bookmark
  const bmBtn = e.target.closest('.bm-btn[data-bm-idx]');
  if (bmBtn) {
    e.stopPropagation();
    const art   = allArticles[parseInt(bmBtn.dataset.bmIdx)];
    if (!art) return;
    const added = bmToggle(art);
    bmBtn.classList.toggle('saved', added);
    bmBtn.innerHTML = bmIconHTML(added);
    return;
  }
  // Bekijk alles
  if (e.target.closest('#bekijkAllesBtn')) return;
  // Kaart
  const card = e.target.closest('[data-idx]');
  if (!card) return;
  openPopup(allArticles[parseInt(card.dataset.idx)]);
});

document.getElementById('headerBar').addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

document.getElementById('sourceRow').addEventListener('click', e => {
  const c = e.target.closest('.source-chip');
  if (!c || c.dataset.source === 'meer') return;
  document.querySelectorAll('.source-chip').forEach(x => x.classList.remove('active'));
  c.classList.add('active');
  activeSource = c.dataset.source;
  render();
});

// Opgeslagen header btn
document.getElementById('opgeslagenHeaderBtn').addEventListener('click', e => {
  e.stopPropagation();
  document.querySelector('[data-tab="opgeslagen"]')?.click();
});

// Opgeslagen panel klikken
document.getElementById('opgeslagenPanel').addEventListener('click', e => {
  const bmBtn = e.target.closest('.bm-btn[data-bm-link]');
  if (bmBtn) {
    e.stopPropagation();
    const link = bmBtn.dataset.bmLink;
    const list = bmLoad(); const i = list.findIndex(a => a.link === link);
    if (i >= 0) { list.splice(i,1); localStorage.setItem(BMARK_KEY, JSON.stringify(list)); }
    renderOpgeslagen();
    return;
  }
  const card = e.target.closest('[data-bm-link]');
  if (!card) return;
  const art = bmLoad().find(a => a.link === card.dataset.bmLink);
  if (art) openPopup(art);
});

// ── PULL TO REFRESH ───────────────────────────────────────────────────────────
let ptrStartY = 0, ptrActive = false, ptrTriggered = false;
const ptrInd = document.getElementById('ptrIndicator');
const ptrSpin = document.getElementById('ptrSpinner');
const ptrTxt  = document.getElementById('ptrText');

document.addEventListener('touchstart', e => {
  if (window.scrollY === 0) { ptrStartY = e.touches[0].clientY; ptrActive = true; ptrTriggered = false; }
}, { passive: true });
document.addEventListener('touchmove', e => {
  if (!ptrActive) return;
  const d = e.touches[0].clientY - ptrStartY;
  if (d > 10) {
    ptrInd.classList.add('visible');
    ptrTxt.textContent = d > 80 ? 'Loslaten om te verversen' : 'Trek naar beneden…';
    ptrTriggered = d > 80;
  }
}, { passive: true });
document.addEventListener('touchend', () => {
  if (ptrTriggered) {
    ptrSpin.classList.add('spinning'); ptrTxt.textContent = 'Verversen…';
    init().then(() => { ptrSpin.classList.remove('spinning'); ptrInd.classList.remove('visible'); });
  } else { ptrInd.classList.remove('visible'); }
  ptrActive = false; ptrTriggered = false;
});

// ── TAB SWIPE ─────────────────────────────────────────────────────────────────
const TAB_ORDER = ['alles','binnenland','buitenland','economie','politiek','opgeslagen'];
let stX = 0, stY = 0, stA = false;
document.getElementById('feedContainer').addEventListener('touchstart', e => {
  stX = e.touches[0].clientX; stY = e.touches[0].clientY; stA = true;
}, { passive: true });
document.getElementById('feedContainer').addEventListener('touchend', e => {
  if (!stA) return; stA = false;
  const dx = e.changedTouches[0].clientX - stX;
  const dy = e.changedTouches[0].clientY - stY;
  if (Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx) * 0.6) return;
  const ci = TAB_ORDER.indexOf(activeTab);
  const ni = dx < 0 ? Math.min(ci+1, TAB_ORDER.length-1) : Math.max(ci-1, 0);
  if (ni !== ci) document.querySelector(`[data-tab="${TAB_ORDER[ni]}"]`)?.click();
}, { passive: true });

// ── TAB SWITCHING ─────────────────────────────────────────────────────────────
document.getElementById('catTabs').addEventListener('click', e => {
  const b = e.target.closest('.tab');
  if (!b) return;
  const tab      = b.dataset.tab;
  const opgsPanel = document.getElementById('opgeslagenPanel');
  const feed      = document.getElementById('feedContainer');
  const srcRow    = document.querySelector('.source-row-wrap');

  document.querySelectorAll('#catTabs .tab').forEach(t => t.classList.remove('active'));
  b.classList.add('active');

  opgsPanel.classList.remove('visible');
  feed.style.display = 'block';
  if (srcRow) srcRow.style.display = '';

  if (tab === 'opgeslagen') {
    feed.style.display = 'none';
    if (srcRow) srcRow.style.display = 'none';
    opgsPanel.classList.add('visible');
    renderOpgeslagen();
  } else {
    activeTab = tab;
    render();
  }
});

// ── POPUP ─────────────────────────────────────────────────────────────────────
let popupCurrentArt = null;
function openPopup(art) {
  if (!art) return;
  popupCurrentArt = art;
  seenMark(seenKey(art));
  document.querySelectorAll(`[data-idx="${allArticles.indexOf(art)}"]`).forEach(el => el.classList.add('seen'));
  document.getElementById('popupTitle').textContent = art.title;
  document.getElementById('popupDesc').textContent  = (art.desc || '').replace(/<[^>]*>/g,'').trim() || 'Geen beschrijving beschikbaar.';
  document.getElementById('popupBtn').href          = art.link;
  const saved = bmHas(art);
  const pb = document.getElementById('popupBmBtn');
  pb.classList.toggle('saved', saved);
  pb.querySelector('.bm-add-icon').style.display    = saved ? 'none' : '';
  pb.querySelector('.bm-remove-icon').style.display = saved ? '' : 'none';
  document.getElementById('popupOverlay').classList.add('open');
  document.getElementById('popupSheet').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closePopup() {
  document.getElementById('popupOverlay').classList.remove('open');
  document.getElementById('popupSheet').classList.remove('open');
  document.body.style.overflow = '';
}
document.getElementById('popupOverlay').addEventListener('click', closePopup);
document.getElementById('popupSheet').addEventListener('click', e => e.stopPropagation());
document.getElementById('popupClose').addEventListener('click', e => { e.stopPropagation(); closePopup(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePopup(); });
const pSheet = document.getElementById('popupSheet');
let pTouchY = 0;
pSheet.addEventListener('touchstart', e => { pTouchY = e.touches[0].clientY; }, { passive: true });
pSheet.addEventListener('touchend', e => { if (e.changedTouches[0].clientY - pTouchY > 60) closePopup(); }, { passive: true });
document.getElementById('popupBmBtn').addEventListener('click', e => {
  e.stopPropagation();
  if (!popupCurrentArt) return;
  const added = bmToggle(popupCurrentArt);
  const pb = document.getElementById('popupBmBtn');
  pb.classList.toggle('saved', added);
  pb.querySelector('.bm-add-icon').style.display    = added ? 'none' : '';
  pb.querySelector('.bm-remove-icon').style.display = added ? '' : 'none';
  const idx = allArticles.indexOf(popupCurrentArt);
  const feedBtn = document.querySelector(`.bm-btn[data-bm-idx="${idx}"]`);
  if (feedBtn) { feedBtn.classList.toggle('saved', added); feedBtn.innerHTML = bmIconHTML(added); }
});

init();
</script>

<!-- ── DESTEM ── -->
<div class="destem-overlay" id="destemOverlay"></div>
<div class="destem-sheet" id="destemSheet">
  <div class="destem-handle"></div>
  <div class="destem-header">
    <div class="destem-title-row">
      <div class="destem-logo">De<span>Stem</span></div>
      <div class="destem-date-label" id="destemDateLabel"></div>
    </div>
    <button class="destem-close" id="destemClose">&#x2715;</button>
    <button class="destem-generate-btn" id="destemGenerateBtn" title="Genereer nieuwe briefing">&#x21bb;</button>
  </div>
  <div class="destem-player">
    <div class="destem-status" id="destemStatus">
      <div><div class="destem-spinner" id="destemSpinner" style="display:none"></div><div id="destemStatusText">Briefing laden…</div></div>
    </div>
    <div class="destem-progress-wrap" id="destemProgressWrap" style="display:none">
      <div class="destem-progress-fill" id="destemProgressFill"></div>
      <div class="destem-progress-thumb" id="destemProgressThumb"></div>
    </div>
    <div class="destem-times" id="destemTimes" style="display:none">
      <span id="destemTimeCur">0:00</span><span id="destemTimeTot">0:00</span>
    </div>
    <div class="destem-controls" id="destemControls" style="display:none">
      <button class="destem-ctrl" id="destemRewind">
        <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.8"/><text x="7" y="16" font-size="5" font-family="sans-serif" stroke="none" fill="currentColor">15</text></svg>
      </button>
      <button class="destem-play-btn" id="destemPlayBtn">
        <svg viewBox="0 0 24 24">
          <polygon class="play-icon" points="5 3 19 12 5 21 5 3" fill="black" stroke="none"/>
          <g class="pause-icon">
            <line x1="6" y1="4" x2="6" y2="20" stroke="black" stroke-width="3" stroke-linecap="round"/>
            <line x1="18" y1="4" x2="18" y2="20" stroke="black" stroke-width="3" stroke-linecap="round"/>
          </g>
        </svg>
      </button>
      <button class="destem-ctrl" id="destemForward">
        <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.49-3.8"/><text x="7" y="16" font-size="5" font-family="sans-serif" stroke="none" fill="currentColor">15</text></svg>
      </button>
    </div>
  </div>
  <div class="destem-expand-row" id="destemExpandRow">
    <button class="destem-expand-tab active" data-panel="stories">5 verhalen</button>
    <button class="destem-expand-tab" data-panel="script">Script</button>
  </div>
  <div class="destem-stories" id="destemStories"><div id="destemStoriesList"></div></div>
  <div class="destem-script" id="destemScript"></div>
</div>

<script>
(function() {
  const btn          = document.getElementById('destemBtn');
  const overlay      = document.getElementById('destemOverlay');
  const sheet        = document.getElementById('destemSheet');
  const closeBtn     = document.getElementById('destemClose');
  const playBtn      = document.getElementById('destemPlayBtn');
  const rewindBtn    = document.getElementById('destemRewind');
  const forwardBtn   = document.getElementById('destemForward');
  const statusDiv    = document.getElementById('destemStatus');
  const statusText   = document.getElementById('destemStatusText');
  const spinner      = document.getElementById('destemSpinner');
  const controls     = document.getElementById('destemControls');
  const progressWrap = document.getElementById('destemProgressWrap');
  const progressFill = document.getElementById('destemProgressFill');
  const progressThumb= document.getElementById('destemProgressThumb');
  const timeCur      = document.getElementById('destemTimeCur');
  const timeTot      = document.getElementById('destemTimeTot');
  const timesEl      = document.getElementById('destemTimes');
  const scriptDiv    = document.getElementById('destemScript');
  const storiesDiv   = document.getElementById('destemStories');
  const storiesList  = document.getElementById('destemStoriesList');
  const expandRow    = document.getElementById('destemExpandRow');
  const dateLabel    = document.getElementById('destemDateLabel');
  const generateBtn  = document.getElementById('destemGenerateBtn');

  let audio = null, loaded = false, loading = false, rafId = null;

  function openSheet() {
    overlay.classList.add('open'); sheet.classList.add('open');
    document.body.style.overflow = 'hidden';
    if (!loaded && !loading) loadBriefing();
  }
  function closeSheet() {
    overlay.classList.remove('open'); sheet.classList.remove('open');
    document.body.style.overflow = '';
  }

  btn.addEventListener('click', openSheet);
  overlay.addEventListener('click', closeSheet);
  closeBtn.addEventListener('click', closeSheet);
  sheet.addEventListener('click', e => e.stopPropagation());

  generateBtn.addEventListener('click', () => {
    generateBtn.classList.add('spinning');
    generateBriefing('Aoede');
    const t = setInterval(() => { if (!loading) { generateBtn.classList.remove('spinning'); clearInterval(t); } }, 500);
  });

  let _sy = 0;
  sheet.addEventListener('touchstart', e => { _sy = e.touches[0].clientY; }, { passive: true });
  sheet.addEventListener('touchend', e => { if (e.changedTouches[0].clientY - _sy > 70) closeSheet(); }, { passive: true });

  expandRow.addEventListener('click', e => {
    const tab = e.target.closest('[data-panel]');
    if (!tab) return;
    document.querySelectorAll('.destem-expand-tab').forEach(t => t.classList.toggle('active', t.dataset.panel === tab.dataset.panel));
    storiesDiv.classList.toggle('visible', tab.dataset.panel === 'stories');
    scriptDiv.classList.toggle('visible',  tab.dataset.panel === 'script');
  });

  function applyMeta(data) {
    const d = new Date(data.date);
    dateLabel.textContent = d.toLocaleDateString('nl-BE', { weekday:'long', day:'numeric', month:'long' });
    if (Array.isArray(data.stories) && data.stories.length) renderStories(data.stories);
    if (data.script) scriptDiv.textContent = data.script;
    expandRow.classList.add('visible');
    storiesDiv.classList.add('visible');
    scriptDiv.classList.remove('visible');
    audio = new Audio(data.audioUrl);
    audio.preload = 'auto';
    audio.addEventListener('loadedmetadata', () => {
      timeTot.textContent = fmt(audio.duration);
      statusDiv.style.display = 'none'; controls.style.display = 'flex';
      progressWrap.style.display = 'block'; timesEl.style.display = 'flex';
      loaded = true; loading = false;
    });
    audio.addEventListener('ended', () => { playBtn.classList.remove('playing'); cancelAnimationFrame(rafId); });
    audio.addEventListener('error', () => { setStatus('Audio kon niet worden afgespeeld.', false); loading = false; });
  }

  async function loadBriefing() {
    loading = true; setStatus('Briefing laden…', true);
    try {
      const res  = await fetch('/api/destem', { signal: AbortSignal.timeout(12000) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'fout');
      applyMeta(data);
    } catch (err) {
      setStatus(err.message.includes('404') || err.message.includes('Nog geen')
        ? 'De briefing is nog niet klaar. Kom na 06:00 terug.'
        : 'Kon briefing niet laden: ' + err.message, false);
      loading = false;
    }
  }

  function generateBriefing(voice) {
    if (loading) return;
    loading = true; loaded = false;
    if (audio) { audio.pause(); audio = null; }
    playBtn.classList.remove('playing'); cancelAnimationFrame(rafId);
    const es = new EventSource('/api/destem-generate' + (voice ? '?voice=' + voice : ''));
    es.addEventListener('status', e => { const d = JSON.parse(e.data); setStatus(d.message + (d.total ? ` (${d.step}/${d.total})` : ''), true); });
    es.addEventListener('stories', e => { const d = JSON.parse(e.data); if (d.stories?.length) { renderStories(d.stories); expandRow.classList.add('visible'); storiesDiv.classList.add('visible'); } });
    es.addEventListener('done', e => { es.close(); applyMeta(JSON.parse(e.data)); });
    es.addEventListener('error', e => { es.close(); let m = 'Generatie mislukt'; try { m = JSON.parse(e.data).message || m; } catch {} setStatus('⚠ ' + m, false); loading = false; });
    es.onerror = () => { if (!loaded) { es.close(); setStatus('Verbinding verbroken.', false); loading = false; } };
  }

  const SRC = { detijd:'De Tijd', standaard:'De Standaard', hln:'HLN', politico:'Politico' };
  function _e(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function renderStories(stories) {
    storiesList.innerHTML = [...stories].sort((a,b)=>(a.rank||99)-(b.rank||99)).map(s =>
      `<div class="destem-story-card${s.rank===1?' rank-1':''}">
        <div class="destem-story-rank">${s.rank}</div>
        <div class="destem-story-body">
          <div class="destem-story-title">${_e(s.title)}</div>
          <div class="destem-story-summary">${_e(s.summary)}</div>
          ${s.source ? `<div class="destem-story-source">${_e(SRC[s.source]||s.source)}</div>` : ''}
        </div>
      </div>`
    ).join('');
  }

  playBtn.addEventListener('click', () => {
    if (!audio) return;
    if (audio.paused) { audio.play(); playBtn.classList.add('playing'); rafId = requestAnimationFrame(tick); }
    else { audio.pause(); playBtn.classList.remove('playing'); cancelAnimationFrame(rafId); }
  });
  rewindBtn.addEventListener('click',  () => { if (audio) audio.currentTime = Math.max(0, audio.currentTime-15); });
  forwardBtn.addEventListener('click', () => { if (audio) audio.currentTime = Math.min(audio.duration, audio.currentTime+15); });

  function tick() {
    if (!audio || audio.paused) return;
    const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
    progressFill.style.width = pct+'%'; progressThumb.style.left = pct+'%';
    timeCur.textContent = fmt(audio.currentTime);
    rafId = requestAnimationFrame(tick);
  }
  progressWrap.addEventListener('click', e => {
    if (!audio?.duration) return;
    const r = progressWrap.getBoundingClientRect();
    const p = Math.max(0, Math.min(1, (e.clientX-r.left)/r.width));
    audio.currentTime = p * audio.duration;
    progressFill.style.width = (p*100)+'%'; progressThumb.style.left = (p*100)+'%';
  });

  function fmt(s) { if (!s||isNaN(s)) return '0:00'; return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'); }
  function setStatus(msg, isLoading) {
    statusDiv.style.display='flex'; controls.style.display='none';
    progressWrap.style.display='none'; timesEl.style.display='none';
    expandRow.classList.remove('visible'); storiesDiv.classList.remove('visible'); scriptDiv.classList.remove('visible');
    spinner.style.display = isLoading ? 'block' : 'none';
    statusText.textContent = msg;
  }
})();
</script>
</body>
