<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>DeBrief</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap');

  @font-face {
    font-family: 'Roobert';
    src: url('Roobert-Regular.woff') format('woff');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Roobert';
    src: url('Roobert-Bold.woff') format('woff');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --bg: #272a2d;
    --bg-card: #32363a;
    --ink: #F0EDE6;
    --ink-muted: #9A9690;
    --ink-faint: #5A5750;
    --accent: #C8311A;
    --accent-soft: #2E1810;
    --eu-color: #7A9FE8;
    --eu-bg: #0D1830;
    --be-color: #6ADA8A;
    --be-bg: #0C2010;
    --world-color: #D4945A;
    --world-bg: #231500;
    --border: #3e4347;
    --shadow-card: 0 1px 3px rgba(0,0,0,.2), 0 4px 12px rgba(0,0,0,.15);
    --shadow-card-hover: 0 2px 8px rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.2);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --font-sans: 'Roobert','DM Sans',-apple-system,system-ui,sans-serif;
    --font-serif: 'DM Serif Display','Georgia',serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; -webkit-text-size-adjust: 100%; width: 100%; overflow-x: hidden; scrollbar-width: none; }
  html::-webkit-scrollbar { display: none; }

  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    overscroll-behavior: none;
    width: 100%;
    max-width: 100vw;
    overflow-x: hidden;
    scrollbar-width: none;
  }
  body::-webkit-scrollbar { display: none; }

  /* ── HEADER ── */
  .header {
    position: sticky; top: 0; left: 0; right: 0; z-index: 100;
    width: 100%; max-width: 100vw; overflow: hidden;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: calc(var(--safe-top) + 14px) 20px 0;
  }
  .header-top {
    display: flex; align-items: center;
    justify-content: space-between; padding-bottom: 10px;
  }
  .logo { font-family: var(--font-serif); font-size: 28px; letter-spacing: -.5px; line-height: 1; }
  .logo span { color: var(--accent); }
  .header-actions { display: flex; align-items: center; gap: 6px; }
  .header-icon-btn {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: none; border: none; cursor: pointer;
    color: var(--ink-muted); transition: background .15s, color .15s;
    -webkit-tap-highlight-color: transparent;
    text-decoration: none;
  }
  .header-icon-btn:hover { background: var(--border); color: var(--ink); }
  .header-icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .header-date {
    font-size: 13px; font-weight: 500; color: var(--ink-muted);
    letter-spacing: .01em; white-space: nowrap;
    text-transform: capitalize;
  }

  /* ── TAB BAR ONDERAAN ── */
  .tab-bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
    background: rgba(39,42,45,.97);
    border-top: 1px solid var(--border);
    display: flex; align-items: stretch;
    padding-bottom: var(--safe-bottom);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  }
  .tab {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center;
    padding: 10px 2px 8px; border: none; background: none;
    color: var(--ink-faint);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: color .15s; min-width: 0;
    gap: 4px;
  }
  .tab svg { width: 24px; height: 24px; stroke: currentColor; fill: none;
    stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .tab-label {
    font-size: 10px; font-weight: 500; letter-spacing: .01em;
    white-space: nowrap; color: inherit;
  }
  .tab.active { color: var(--accent); }
  .tab.active svg { stroke-width: 2.2; }

  /* ── SOURCE ROW ── */
  .source-row-wrap {
    overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
    border-top: 1px solid var(--border); padding: 10px 0 11px;
  }
  .source-row-wrap::-webkit-scrollbar { display: none; }
  .source-row { display: flex; gap: 7px; width: max-content; padding: 0 20px; }
  .source-chip {
    font-size: 12px; font-weight: 600; letter-spacing: .01em;
    padding: 6px 14px; border-radius: 20px;
    border: 1.5px solid var(--border); background: var(--bg-card); color: var(--ink-muted);
    cursor: pointer; white-space: nowrap; transition: all .15s;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .source-chip.active { background: var(--ink); border-color: var(--ink); color: #fff; box-shadow: none; }

  /* ── FEED ── */
  .feed { padding: 0 0 calc(var(--safe-bottom) + 88px); max-width: 680px; margin: 0 auto; }
  .feed .section-head { margin: 20px 14px 12px; }
  .feed .article-card { margin-left: 14px; margin-right: 14px; }
  .feed .error-banner { margin: 14px 14px 0; }
  .feed .empty-state  { padding-left: 14px; padding-right: 14px; }

  /* ── STATUS ── */
  .status-screen {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 50vh; gap: 14px; color: var(--ink-muted);
  }
  .spinner {
    width: 30px; height: 30px; border: 2.5px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .load-msg { font-size: 13px; color: var(--ink-muted); }

  /* ── TOP STORY ── */
  .top-story {
    display: block; text-decoration: none; color: inherit;
    background: transparent; border: none;
    border-radius: 0; overflow: visible; margin-bottom: 12px;
    margin-left: -14px; margin-right: -14px;
    -webkit-tap-highlight-color: transparent;
    transition: opacity .18s;
    animation: fadeUp .3s ease both;
    position: relative;
  }
  .top-story:active { opacity: .88; }
  .top-story-img-wrap { position: relative; }
  .top-story-img { width: 100%; height: 320px; object-fit: cover; display: block; background: var(--border); }
  .top-story-img-overlay {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 100%;
    background: linear-gradient(to bottom, transparent 0%, transparent 30%, #272a2d 100%);
    pointer-events: none;
  }
  .top-story-cat-pill {
    position: absolute; bottom: 12px; left: 14px;
    font-size: 11px; font-weight: 700; letter-spacing: .04em;
    padding: 4px 10px; border-radius: 20px;
    background: var(--accent); color: #fff;
  }
  .top-story-body { padding: 12px 16px 20px; }
  .top-story .meta-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 0; }
  .top-story h2 {
    font-family: var(--font-serif); font-size: 24px; line-height: 1.25;
    letter-spacing: -.3px; color: var(--ink); margin-bottom: 10px;
  }
  .top-story-desc {
    font-size: 13px; line-height: 1.55; color: var(--ink-muted); margin-bottom: 12px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .top-story-source-row {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--ink); margin-top: 6px;
  }

  /* ── SECTION HEADING ── */
  .section-head { display: flex; align-items: center; justify-content: space-between; margin: 0 0 12px; }
  .section-head h3 {
    font-size: 16px; font-weight: 700; letter-spacing: -.1px;
    color: var(--ink); white-space: nowrap;
  }
  .section-head .count-chip { order: 2; }

  /* ── ARTICLE CARD ── */
  .article-card {
    display: flex; text-decoration: none; color: inherit;
    background: var(--bg-card); border: none;
    border-radius: 14px; overflow: hidden; margin-bottom: 10px; min-height: 100px;
    -webkit-tap-highlight-color: transparent;
    transition: transform .15s, box-shadow .15s;
    box-shadow: var(--shadow-card);
    animation: fadeUp .3s ease both;
  }
  .article-card:active { transform: scale(.985); box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .article-card.seen { opacity: .5; }
  .article-card.seen h3 { color: var(--ink-muted); }
  .article-card-img {
    width: 100px; min-width: 100px; height: 100px;
    object-fit: cover; flex-shrink: 0; background: var(--border);
  }
  .article-card-placeholder {
    width: 100px; min-width: 100px; height: 100px; flex-shrink: 0;
    background: linear-gradient(135deg,#2A2720 0%,#1E1C18 100%);
  }
  .article-card-body {
    padding: 13px 14px; flex: 1; display: flex;
    flex-direction: column; justify-content: space-between; min-width: 0;
    position: relative;
  }
  .article-card h3 {
    font-size: 14px; font-weight: 600; line-height: 1.35; color: var(--ink);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden; margin-bottom: 8px;
  }

  /* ── BOOKMARK BTN ── */
  .bm-btn {
    background: none; border: none; padding: 4px; cursor: pointer;
    color: var(--ink-muted); line-height: 0; flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
    transition: color .15s, transform .15s;
    margin-left: auto;
  }
  .bm-btn:active { transform: scale(.85); }
  .bm-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .bm-btn.saved { color: var(--accent); }
  .bm-btn.saved svg { fill: var(--accent); }

  /* ── OPGESLAGEN PANEL ── */
  .opgeslagen-panel { display:none; max-width: 680px; margin: 0 auto; padding: 0 0 calc(var(--safe-bottom) + 88px); }
  .opgeslagen-panel.visible { display: block; }
  .opgeslagen-empty { text-align: center; padding: 60px 20px; color: var(--ink-muted); }
  .opgeslagen-empty .icon { font-size: 40px; display: block; margin-bottom: 12px; }
  .opgeslagen-empty p { font-size: 15px; line-height: 1.5; margin: 0; }
  .opgeslagen-panel .section-head { margin: 20px 14px 12px; }
  .opgeslagen-panel .article-card { margin-left: 14px; margin-right: 14px; }

  /* ── META ROW ── */
  .meta-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .source-time { font-size: 11px; color: var(--ink); white-space: nowrap; }
  .count-chip {
    font-size: 12px; font-weight: 600;
    background: var(--border); color: var(--ink-muted);
    padding: 2px 9px; border-radius: 10px;
  }

  /* ── LABELS ── */
  .label {
    font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 20px; white-space: nowrap;
  }
  .label-eu, .label-be, .label-world {
    font-size: 13px; letter-spacing: 0; text-transform: none; padding: 0 3px;
    background: none;
  }
  .label-eu      { color: var(--eu-color); }
  .label-be      { color: var(--be-color); }
  .label-world   { color: var(--world-color); }
  .label-politiek  { background: #1E1030; color: #C4A0F5; }
  .label-economie  { background: #231500; color: #F0A040; }
  .label-binnenland{ background: var(--be-bg); color: #6ADA8A; }
  .label-buitenland{ background: var(--world-bg); color: #D4945A; }

  /* ── PROGRESS BAR ── */
  .progress-bar {
    position: fixed; top: 0; left: 0; height: 2px;
    background: var(--accent); width: 0%; z-index: 999;
    transition: width .25s ease;
  }

  /* ── PULL TO REFRESH ── */
  .ptr-indicator {
    display: flex; align-items: center; justify-content: center;
    height: 0; overflow: hidden; transition: height .2s ease;
    color: var(--ink-muted); font-size: 12px; gap: 8px;
  }
  .ptr-indicator.visible { height: 48px; }
  .ptr-spinner {
    width: 18px; height: 18px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
  }
  .ptr-spinner.spinning { animation: spin .8s linear infinite; }

  /* ── ERROR ── */
  .error-banner {
    background: #2E0D0D; border: 1px solid #5A1A1A;
    border-radius: 12px; padding: 10px 14px;
    font-size: 12px; color: #F87171; margin-bottom: 12px;
  }

  /* ── EMPTY ── */
  .empty-state { text-align: center; padding: 48px 24px; color: var(--ink-muted); }
  .empty-state .icon { font-size: 36px; margin-bottom: 12px; display: block; }
  .empty-state p { font-size: 14px; line-height: 1.6; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .article-card:nth-child(2) { animation-delay:.05s }
  .article-card:nth-child(3) { animation-delay:.10s }
  .article-card:nth-child(4) { animation-delay:.15s }
  .article-card:nth-child(5) { animation-delay:.20s }
  .article-card:nth-child(6) { animation-delay:.25s }
  .article-card:nth-child(7) { animation-delay:.30s }
  .article-card:nth-child(8) { animation-delay:.35s }

  /* ── ARTICLE POPUP ── */
  .popup-overlay {
    position: fixed; inset: 0; z-index: 300;
    background: rgba(0,0,0,.45);
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease;
  }
  .popup-overlay.open { opacity: 1; pointer-events: all; }

  .popup-sheet {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 301;
    background: var(--bg-card);
    border-radius: 24px 24px 0 0;
    padding: 0 0 calc(var(--safe-bottom) + 12px);
    max-height: 80vh; overflow-y: auto;
    transform: translateY(100%);
    transition: transform .3s cubic-bezier(.32,.72,0,1);
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .popup-sheet::-webkit-scrollbar { display: none; }
  .popup-sheet.open { transform: translateY(0); }

  .popup-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 20px 0;
  }
  .popup-close {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--border); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-muted); font-size: 18px; line-height: 1;
    -webkit-tap-highlight-color: transparent; transition: background .15s;
    flex-shrink: 0;
  }
  .popup-close:hover { background: var(--ink-faint); }
  .popup-handle {
    width: 36px; height: 4px; border-radius: 2px;
    background: var(--ink-faint); margin: 12px auto 16px;
  }
  .popup-body { padding: 0 20px 8px; }
  .popup-title {
    font-family: var(--font-serif); font-size: 20px; line-height: 1.3;
    letter-spacing: -.2px; color: var(--ink); margin-bottom: 12px;
  }
  .popup-desc {
    font-size: 14px; line-height: 1.65; color: var(--ink-muted);
    margin-bottom: 20px;
  }
  .popup-btn {
    display: block; width: 100%; padding: 14px;
    background: var(--ink); color: var(--bg-card);
    font-family: var(--font-sans); font-size: 14px; font-weight: 600;
    text-align: center; text-decoration: none;
    border-radius: 14px; border: none; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background .15s;
  }
  .popup-btn:hover  { background: var(--accent); }
  .popup-btn:active { background: var(--accent); }

  /* ── DESTEM KNOP ── */
  .header-icon-btn.destem-btn.playing {
    background: var(--accent); color: #fff;
  }

  /* ── DESTEM PANEEL ── */
  .destem-overlay {
    position: fixed; inset: 0; z-index: 400;
    background: rgba(0,0,0,.45);
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease;
  }
  .destem-overlay.open { opacity: 1; pointer-events: all; }

  .destem-sheet {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 401;
    background: var(--bg-card);
    border-radius: 20px 20px 0 0;
    padding: 0 0 calc(var(--safe-bottom) + 24px);
    transform: translateY(100%);
    transition: transform .3s cubic-bezier(.32,.72,0,1);
  }
  .destem-sheet.open { transform: translateY(0); }

  .destem-handle {
    width: 36px; height: 4px; border-radius: 2px;
    background: var(--ink-faint); margin: 14px auto 0;
  }

  .destem-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px 0;
  }
  .destem-title-row { display: flex; align-items: center; gap: 8px; }
  .destem-logo {
    font-family: var(--font-serif); font-size: 20px;
    letter-spacing: -.3px; line-height: 1; color: var(--ink);
  }
  .destem-logo span { color: var(--accent); }
  .destem-date-label {
    font-size: 11px; font-weight: 500; letter-spacing: .06em;
    text-transform: uppercase; color: var(--ink-faint);
  }
  .destem-generate-btn {
    background: none; border: 1.5px solid var(--border); border-radius: 50%;
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 16px; color: var(--ink-muted); transition: color .2s, border-color .2s;
    margin-left: 6px;
  }
  .destem-generate-btn:hover { color: var(--accent); border-color: var(--accent); }
  .destem-generate-btn.spinning { animation: destem-spin 1s linear infinite; }
  @keyframes destem-spin { to { transform: rotate(360deg); } }
  .destem-close {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--border); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-muted); font-size: 16px; line-height: 1;
    -webkit-tap-highlight-color: transparent;
  }

  .destem-player { padding: 20px 20px 0; }

  .destem-progress-wrap {
    position: relative; height: 4px; border-radius: 2px;
    background: var(--border); margin-bottom: 10px; cursor: pointer;
  }
  .destem-progress-fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    border-radius: 2px; background: var(--accent);
    width: 0%; transition: width .3s linear;
    pointer-events: none;
  }
  .destem-progress-thumb {
    position: absolute; top: 50%; transform: translate(-50%,-50%);
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); left: 0%;
    box-shadow: 0 0 0 3px var(--bg-card);
    pointer-events: none;
  }

  .destem-times {
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--ink-faint); margin-bottom: 18px;
  }

  .destem-controls {
    display: flex; align-items: center; justify-content: center; gap: 24px;
    margin-bottom: 20px;
  }
  .destem-ctrl {
    background: none; border: none; cursor: pointer;
    color: var(--ink-muted); padding: 6px;
    -webkit-tap-highlight-color: transparent; transition: color .15s;
  }
  .destem-ctrl:hover { color: var(--ink); }
  .destem-ctrl svg {
    width: 22px; height: 22px; stroke: currentColor; fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }
  .destem-play-btn {
    width: 54px; height: 54px; border-radius: 50%;
    background: var(--ink); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent; transition: background .15s;
    flex-shrink: 0;
  }
  .destem-play-btn:hover { background: var(--accent); }
  .destem-play-btn svg {
    width: 22px; height: 22px; stroke: #fff; fill: none;
    stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
  }
  .destem-play-btn.playing svg .play-icon { display: none; }
  .destem-play-btn:not(.playing) svg .pause-icon { display: none; }

  .destem-status {
    text-align: center; font-size: 13px; color: var(--ink-muted);
    min-height: 40px; display: flex; align-items: center;
    justify-content: center; padding: 0 20px; line-height: 1.5;
  }
  .destem-spinner {
    width: 20px; height: 20px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin .7s linear infinite; margin: 0 auto 8px;
  }

  /* ── DESTEM STORIES ── */
  .destem-stories { padding: 4px 20px 0; display: none; }
  .destem-stories.visible { display: block; }
  .destem-stories-label {
    font-size: 10px; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; color: var(--ink-faint);
    margin-bottom: 10px;
  }
  .destem-story-card {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 11px 0; border-bottom: 1px solid var(--border);
  }
  .destem-story-card:last-child { border-bottom: none; }
  .destem-story-rank {
    font-family: var(--font-serif); font-size: 22px; line-height: 1;
    color: var(--ink-faint); min-width: 24px; padding-top: 2px;

    color: var(--ink-muted); max-height: 200px; overflow-y: auto;

    color: var(--ink); border-bottom-color: var(--accent);

</style>
</head>

<script>
// ── CONFIG ───────────────────────────────────────────────────────────────────
const RSS2JSON_BASE = 'https://api.rss2json.com/v1/api.json?api_key=goxrkjvrqv2dqaaj0mybmnl0vyjxhqccxlh906cv&count=100&rss_url=';

const SOURCES = [
  { id:'detijd',     name:'De Tijd',      region:'be', urls:[
      'https://www.tijd.be/rss/nieuws.xml',
      'https://www.tijd.be/rss/politiek.xml',
      'https://www.tijd.be/rss/ondernemen.xml'
  ]},
  { id:'standaard',  name:'De Standaard', region:'be', urls:[
      'https://www.standaard.be/binnenland/rss/',
      'https://www.standaard.be/buitenland/rss/',
      'https://www.standaard.be/economie/rss/',
      'https://www.standaard.be/economie/beurs/rss/',
      'https://www.standaard.be/opinies/rss/'
  ]},
  { id:'hln',        name:'HLN',          region:'be', urls:['https://www.hln.be/home/rss.xml'] }
];

// ── CATEGORISATIE PER BRON ────────────────────────────────────────────────────

// HLN: URL-gebaseerd
function categoriseHLN(url) {
  if (!url) return 'verwijder';
  const u = url.toLowerCase();
  if (/hln\.be\/buitenlands-voetbal/.test(u)) return 'verwijder';
  if (/hln\.be\/binnenland/.test(u)) return 'binnenland';
  if (/hln\.be\/buitenland/.test(u)) return 'buitenland';
  if (/hln\.be\/(economie|geld|tech|wetenschap)/.test(u)) return 'economie';
  if (/hln\.be\/opinie/.test(u)) return 'binnenland';
  return 'verwijder';
}

// De Standaard: URL-gebaseerd + politiek via keyword op titel
function categoriseDeStandaard(feedUrl, articleUrl, title) {
  if (!articleUrl) return 'verwijder';
  const u = articleUrl.toLowerCase();
  const f = (feedUrl || '').toLowerCase();

  if (/standaard\.be\/binnenland/.test(u)) {
    // Binnenland-feed: check of het politiek is via titel
    return isPolitiek(title) ? 'politiek' : 'binnenland';
  }
  if (/standaard\.be\/buitenland/.test(u)) {
    return isPolitiek(title) ? 'politiek' : 'buitenland';
  }
  if (/standaard\.be\/economie/.test(u)) return 'economie';
  if (/standaard\.be\/opinies/.test(u)) {
    return isPolitiek(title) ? 'politiek' : 'binnenland';
  }
  return 'verwijder';
}

// De Tijd: Feed-URL-gebaseerd
function categoriseDeTijd(feedUrl, title) {
  const f = (feedUrl || '').toLowerCase();
  if (/politiek/.test(f)) return 'politiek';
  if (/ondernemen/.test(f)) return 'economie';
  if (/nieuws/.test(f)) {
    // nieuws.xml bevat mix: check politiek via titel
    return isPolitiek(title) ? 'politiek' : 'binnenland';
  }
  return 'verwijder';
}

// Politiek keyword check op titel
function isPolitiek(title) {
  const txt = (title || '').toLowerCase();
  const POLITIEK_WORDS = [
    'verkiezing','verkiezingen','stemmen','kiesdrempel','kieskring',
    'parlement','kamer','senaat','volksvertegenwoordiger','kamerlid','fractieleider',
    'regering','coalitie','oppositie','premier','minister','staatssecretaris',
    'partij','politicus','politica','politici',
    'beleid','wet ','wetgeving','decreet','grondwet',
    'debat','motie','begroting','begrotingsdebat',
    'gemeenteraad','burgemeester','schepen','gouverneur',
    'referendum','volksraadpleging',
    'diplomatiek','ambassade','ambassadeur','bilateraal','multilateraal',
    'eu-top','g7','g20','navo',
    'kandidaat','lijsttrekker','partijvoorzitter','partijleider',
    'buitenlands beleid','staatshoofd',
    'n-va','vlaams belang','cd&v','open vld','vooruit','ps ','mr ','pvda','ecolo','groen',
    'trump','biden','macron','scholz','meloni','zelensky','netanyahu','putin',
    'europese commissie','europees parlement','raad van europa',
    'veiligheidsraad','navo-top','eu-beleid',
    'presidentieel','presidentsverkiezing',
    'coalition','opposition','prime minister','president','chancellor',
    'election','vote','ballot','parliament','congress','senate',
    'policy','legislation','bill ','decree','constitution',
    'summit','diplomatic','sanction',
  ];
  return POLITIEK_WORDS.some(w => txt.includes(w));
}

// ── UTILS ────────────────────────────────────────────────────────────────────
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function decodeEntities(str) {
  try {
    const doc = new DOMParser().parseFromString(str, 'text/html');
    return doc.documentElement.textContent;
  } catch { return str; }
}

function formatDate() {
  return new Date().toLocaleDateString('nl-BE',{weekday:'long',day:'numeric',month:'long'});
}

(function() {
  const el = document.getElementById('headerDate');
  if (el) {
    const d = new Date();
    const formatted = d.toLocaleDateString('nl-BE', { weekday: 'long', day: 'numeric', month: 'long' });
    el.textContent = formatted.charAt(0).toUpperCase() + formatted.slice(1);
  }
})();

function timeAgo(ds) {
  if (!ds) return '';
  try {
    const m = (Date.now() - new Date(ds).getTime()) / 60000;
    if (m < 1)    return 'zojuist';
    if (m < 60)   return `${Math.round(m)}m geleden`;
    if (m < 1440) return `${Math.round(m/60)}u geleden`;
    return new Date(ds).toLocaleDateString('nl-BE',{day:'numeric',month:'short'});
  } catch { return ''; }
}

// ── LABELS ───────────────────────────────────────────────────────────────────
const RL = { be:['label-be','🇧🇪'], eu:['label-eu','🇪🇺'], world:['label-world','🌍'] };
const CL = {
  politiek:   ['label-politiek','Politiek'],
  economie:   ['label-economie','Economie'],
  binnenland: ['label-binnenland','Binnenland'],
  buitenland: ['label-buitenland','Buitenland']
};
const rLabel = r => { const [c,t]=RL[r]||['','']; return t?`<span class="label ${c}">${t}</span>`:''; };
const cLabel = c => { const [cl,t]=CL[c]||['','']; return t?`<span class="label ${cl}">${t}</span>`:''; };

// ── PROGRESS ──────────────────────────────────────────────────────────────────
let _done=0, _total=0;
const bar = document.getElementById('progressBar');
function tickProgress() {
  _done++;
  const pct = _total>0 ? Math.round((_done/_total)*100) : 100;
  bar.style.width = pct+'%';
  if (_done >= _total) setTimeout(()=>{ bar.style.width='0%'; }, 700);
}

// ── STATE ────────────────────────────────────────────────────────────────────
let allArticles = [];
let activeTab    = 'alles';
let activeSource = 'alle';

// ── FETCH ONE FEED ────────────────────────────────────────────────────────────
async function fetchFeed(feedUrl, meta) {
  const api = RSS2JSON_BASE + encodeURIComponent(feedUrl);
  const res  = await fetch(api, { signal: AbortSignal.timeout(10000) });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  if (data.status !== 'ok' || !Array.isArray(data.items)) throw new Error(data.message || 'rss2json error');

  return data.items.map(item => {
    let image = item.thumbnail || item.enclosure?.link || null;
    if (image && /1x1|pixel|track|blank|spacer/i.test(image)) image = null;
    const title   = decodeEntities(decodeEntities((item.title || '').trim()));
    const link    = item.link || item.guid || '';
    const pubDate = item.pubDate || null;
    const desc    = (item.description || item.content || '').trim();

    let cat;
    if (meta.id === 'hln') {
      cat = categoriseHLN(link);
      if (cat === 'verwijder') return null;
    } else if (meta.id === 'detijd') {
      cat = categoriseDeTijd(feedUrl, title);
      if (cat === 'verwijder') return null;
    } else if (meta.id === 'standaard') {
      cat = categoriseDeStandaard(feedUrl, link, title);
      if (cat === 'verwijder') return null;
    } else {
      cat = 'overig';
    }

    return { title, link, pubDate, image, cat, desc, source: { name: meta.name, region: meta.region, id: meta.id } };
  }).filter(Boolean);
}

// ── LOAD ALL ──────────────────────────────────────────────────────────────────
async function loadAll() {
  const tasks = SOURCES.flatMap(src =>
    src.urls.map(url => ({ url, meta: src }))
  );
  _done = 0; _total = tasks.length;
  bar.style.width = '0%';

  const errors = [];
  const settled = await Promise.allSettled(
    tasks.map(t =>
      fetchFeed(t.url, t.meta)
        .then(items => { tickProgress(); return items; })
        .catch(e    => { tickProgress(); errors.push(`${t.meta.name}: ${e.message}`); return []; })
    )
  );

  let arts = settled.flatMap(r => r.status==='fulfilled' ? r.value : []);

  const recent = arts.filter(a => {
    if (!a.pubDate) return false;
    return (Date.now() - new Date(a.pubDate).getTime()) < 24 * 60 * 60 * 1000;
  });
  arts = (recent.length > 0 ? recent : arts)
    .sort((a,b) => new Date(b.pubDate||0) - new Date(a.pubDate||0));

  const seen = new Set();
  allArticles = arts.filter(a => {
    const k = a.title.toLowerCase().replace(/\W/g,'').slice(0,50);
    if (seen.has(k)) return false;
    seen.add(k); return true;
  });

  return errors;
}

// ── FILTER ────────────────────────────────────────────────────────────────────
function filtered() {
  let arts = allArticles;
  if (activeSource !== 'alle') arts = arts.filter(a => a.source.name === activeSource);
  if (activeTab !== 'alles')   arts = arts.filter(a => a.cat === activeTab);
  return arts;
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render(errors=[]) {
  const container = document.getElementById('feedContainer');
  const arts = filtered();
  const seenMap = seenLoad();
  let html = '';

  if (errors.length) {
    const names = [...new Set(errors.map(e=>e.split(':')[0]))].join(', ');
    html += `<div class="error-banner">⚠️ Sommige feeds konden niet worden geladen: <strong>${names}</strong></div>`;
  }

  if (!arts.length) {
    html += `<div class="empty-state"><span class="icon">📭</span><p>Geen artikels voor<br>deze selectie vandaag.</p></div>`;
    container.innerHTML = html; return;
  }

  const [top, ...rest] = arts;
  const topIdx = allArticles.indexOf(top);
  const topSeen = isSeen(top, seenMap);

  const topCatLabel = CL[top.cat] ? CL[top.cat][1] : '';
  html += `<div class="top-story${topSeen ? ' seen' : ''}" data-idx="${topIdx}" style="cursor:pointer">`;
  if (top.image) {
    html += `<div class="top-story-img-wrap">`;
    html += `<img class="top-story-img" src="${esc(top.image)}" alt="" loading="eager" onerror="this.closest('.top-story-img-wrap').style.display='none'">`;
    html += `<div class="top-story-img-overlay"></div>`;
    if (topCatLabel) html += `<span class="top-story-cat-pill">${esc(topCatLabel)}</span>`;
    html += `</div>`;
  }
  html += `<div class="top-story-body">`;
  html += `<h2>${esc(top.title)}</h2>`;
  if (top.desc) {
    const cleanDesc = top.desc.replace(/<[^>]*>/g,'').trim();
    if (cleanDesc) html += `<div class="top-story-desc">${esc(cleanDesc)}</div>`;
  }
  html += `<div class="top-story-source-row">${rLabel(top.source.region)}<span class="source-time">${esc(top.source.name)} · ${timeAgo(top.pubDate)}</span></div>`;
  html += `</div></div>`;

  if (rest.length) {
    html += `<div class="section-head"><h3>Meer nieuws</h3><span class="count-chip">${rest.length}</span></div>`;
  }

  for (const art of rest) {
    const idx = allArticles.indexOf(art);
    const seen = isSeen(art, seenMap);
    const saved = bmHas(art);
    html += `<div class="article-card${seen ? ' seen' : ''}" data-idx="${idx}" style="cursor:pointer">`;
    if (art.image) {
      html += `<img class="article-card-img" src="${esc(art.image)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'article-card-placeholder'}))">`;
    } else {
      html += `<div class="article-card-placeholder"></div>`;
    }
    html += `<div class="article-card-body">`;
    html += `<h3>${esc(art.title)}</h3>`;
    html += `<div class="meta-row">${cLabel(art.cat)}<span class="source-time">${esc(art.source.name)} · ${timeAgo(art.pubDate)}</span><button class="bm-btn${saved ? ' saved' : ''}" data-bm-idx="${idx}" aria-label="${saved ? 'Verwijder bladwijzer' : 'Bewaar artikel'}">${bmIconHTML(saved)}</button></div>`;
    html += `</div></div>`;
  }

  container.innerHTML = html;
}

// ── LEESVOORTGANG ─────────────────────────────────────────────────────────────
const SEEN_KEY = 'debrief_seen_v1';
const SEEN_TTL = 7 * 24 * 60 * 60 * 1000;

function seenLoad() {
  try {
    const raw = JSON.parse(localStorage.getItem(SEEN_KEY) || '{}');
    const now = Date.now();
    for (const k of Object.keys(raw)) if (now - raw[k] > SEEN_TTL) delete raw[k];
    return raw;
  } catch { return {}; }
}
function seenMark(key) {
  try {
    const raw = seenLoad();
    raw[key] = Date.now();
    localStorage.setItem(SEEN_KEY, JSON.stringify(raw));
  } catch {}
}
function seenKey(art) { return art.link.slice(-60); }
function isSeen(art, seenMap) { return !!seenMap[seenKey(art)]; }

// ── BLADWIJZERS ───────────────────────────────────────────────────────────────
const BMARK_KEY = 'debrief_bookmarks_v1';

function bmLoad() {
  try { return JSON.parse(localStorage.getItem(BMARK_KEY) || '[]'); } catch { return []; }
}
function bmKey(art) { return art.link; }
function bmHas(art) { return bmLoad().some(a => a.link === bmKey(art)); }
function bmToggle(art) {
  const list = bmLoad();
  const idx = list.findIndex(a => a.link === bmKey(art));
  if (idx >= 0) { list.splice(idx, 1); }
  else {
    list.unshift({ title: art.title, link: art.link, desc: art.desc || '', image: art.image || '',
      source: art.source, pubDate: art.pubDate, cat: art.cat, savedAt: Date.now() });
  }
  try { localStorage.setItem(BMARK_KEY, JSON.stringify(list)); } catch {}
  return idx < 0;
}

function bmIconHTML(saved) {
  if (saved) {
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 7.5-5 5"/><path d="M17 3a2 2 0 0 1 2 2v15a1 1 0 0 1-1.496.868l-4.512-2.578a2 2 0 0 0-1.984 0l-4.512 2.578A1 1 0 0 1 5 20V5a2 2 0 0 1 2-2z"/><path d="m9.5 7.5 5 5"/></svg>`;
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v6"/><path d="M15 10H9"/><path d="M17 3a2 2 0 0 1 2 2v15a1 1 0 0 1-1.496.868l-4.512-2.578a2 2 0 0 0-1.984 0l-4.512 2.578A1 1 0 0 1 5 20V5a2 2 0 0 1 2-2z"/></svg>`;
}

function renderOpgeslagen() {
  const panel = document.getElementById('opgeslagenPanel');
  const list = bmLoad();
  if (!list.length) {
    panel.innerHTML = `<div class="opgeslagen-empty"><span class="icon">🔖</span><p>Nog niets opgeslagen.<br>Tik op het bladwijzer-icoon op een artikel.</p></div>`;
    return;
  }
  let html = `<div class="section-head"><h3>Opgeslagen</h3><span class="count-chip">${list.length}</span></div>`;
  for (const art of list) {
    html += `<div class="article-card" data-bm-link="${esc(art.link)}" style="cursor:pointer">`;
    if (art.image) {
      html += `<img class="article-card-img" src="${esc(art.image)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'article-card-placeholder'}))">`;
    } else {
      html += `<div class="article-card-placeholder"></div>`;
    }
    html += `<div class="article-card-body">`;
    html += `<h3>${esc(art.title)}</h3>`;
    html += `<div class="meta-row">${cLabel(art.cat)}<span class="source-time">${esc(art.source.name)} · ${timeAgo(art.pubDate)}</span><button class="bm-btn saved" data-bm-link="${esc(art.link)}" aria-label="Verwijder bladwijzer">${bmIconHTML(true)}</button></div>`;
    html += `</div></div>`;
  }
  panel.innerHTML = html;
}

// ── INIT ──────────────────────────────────────────────────────────────────────
async function init() {
  document.getElementById('feedContainer').innerHTML = `
    <div class="status-screen"><div class="spinner"></div><div class="load-msg">Nieuws ophalen…</div></div>`;
  const errors = await loadAll();
  if (!allArticles.length) {
    document.getElementById('feedContainer').innerHTML = `
      <div class="status-screen">
        <div style="font-size:36px">⚠️</div>
        <div class="load-msg">Kon geen artikels laden.<br>Controleer je verbinding.</div>
      </div>`;
    return;
  }
  render(errors);
}

// ── EVENTS ────────────────────────────────────────────────────────────────────
document.getElementById('feedContainer').addEventListener('click', e => {
  const bmBtn = e.target.closest('.bm-btn[data-bm-idx]');
  if (bmBtn) {
    e.stopPropagation();
    const idx = parseInt(bmBtn.dataset.bmIdx);
    const art = allArticles[idx];
    if (!art) return;
    const added = bmToggle(art);
    bmBtn.classList.toggle('saved', added);
    bmBtn.setAttribute('aria-label', added ? 'Verwijder bladwijzer' : 'Bewaar artikel');
    bmBtn.innerHTML = bmIconHTML(added);
    return;
  }
  const card = e.target.closest('[data-idx]');
  if (!card) return;
  const idx = parseInt(card.dataset.idx);
  const art = allArticles[idx];
  if (art) openPopup(art);
});

document.getElementById('headerBar').addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

document.getElementById('sourceRow').addEventListener('click', e => {
  const c = e.target.closest('.source-chip'); if (!c) return;
  document.querySelectorAll('.source-chip').forEach(x => x.classList.remove('active'));
  c.classList.add('active');
  activeSource = c.dataset.source;
  render();
});

// ── PULL TO REFRESH ──────────────────────────────────────────────────────────
let ptrStartY = 0, ptrActive = false, ptrTriggered = false;
const ptrIndicator = document.getElementById('ptrIndicator');
const ptrSpinner   = document.getElementById('ptrSpinner');
const ptrText      = document.getElementById('ptrText');
const THRESHOLD    = 80;

document.addEventListener('touchstart', e => {
  if (window.scrollY === 0) { ptrStartY = e.touches[0].clientY; ptrActive = true; ptrTriggered = false; }
}, { passive: true });

document.addEventListener('touchmove', e => {
  if (!ptrActive) return;
  const dist = e.touches[0].clientY - ptrStartY;
  if (dist > 10) {
    ptrIndicator.classList.add('visible');
    ptrText.textContent = dist > THRESHOLD ? 'Loslaten om te verversen' : 'Trek naar beneden om te verversen';
    ptrTriggered = dist > THRESHOLD;
  }
}, { passive: true });

document.addEventListener('touchend', () => {
  if (ptrTriggered) {
    ptrSpinner.classList.add('spinning');
    ptrText.textContent = 'Verversen…';
    init().then(() => { ptrSpinner.classList.remove('spinning'); ptrIndicator.classList.remove('visible'); });
  } else {
    ptrIndicator.classList.remove('visible');
  }
  ptrActive = false; ptrTriggered = false;
});

// ── TAB SWIPE ─────────────────────────────────────────────────────────────────
const TAB_ORDER = ['alles', 'binnenland', 'buitenland', 'economie', 'politiek', 'opgeslagen'];
let swipeTabStartX = 0, swipeTabStartY = 0, swipeTabActive = false;

document.getElementById('feedContainer').addEventListener('touchstart', e => {
  swipeTabStartX = e.touches[0].clientX;
  swipeTabStartY = e.touches[0].clientY;
  swipeTabActive = true;
}, { passive: true });

document.getElementById('feedContainer').addEventListener('touchend', e => {
  if (!swipeTabActive) return;
  swipeTabActive = false;
  const dx = e.changedTouches[0].clientX - swipeTabStartX;
  const dy = e.changedTouches[0].clientY - swipeTabStartY;
  if (Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx) * 0.6) return;
  const currentIdx = TAB_ORDER.indexOf(activeTab);
  const nextIdx = dx < 0
    ? Math.min(currentIdx + 1, TAB_ORDER.length - 1)
    : Math.max(currentIdx - 1, 0);
  if (nextIdx === currentIdx) return;
  document.querySelector(`[data-tab="${TAB_ORDER[nextIdx]}"]`)?.click();
}, { passive: true });

// ── TAB SWITCHING ─────────────────────────────────────────────────────────────
document.getElementById('catTabs').addEventListener('click', e => {
  const b = e.target.closest('.tab');
  if (!b) return;
  const tab        = b.dataset.tab;
  const opgsPanel  = document.getElementById('opgeslagenPanel');
  const feed       = document.getElementById('feedContainer');
  const srcRow     = document.querySelector('.source-row-wrap');

  document.querySelectorAll('#catTabs .tab').forEach(t => t.classList.remove('active'));
  b.classList.add('active');

  opgsPanel.classList.remove('visible');
  feed.style.display = 'block';
  if (srcRow) srcRow.style.display = '';

  if (tab === 'opgeslagen') {
    feed.style.display = 'none';
    if (srcRow) srcRow.style.display = 'none';
    opgsPanel.classList.add('visible');
    renderOpgeslagen();
  } else {
    activeTab = tab;
    render();
  }
});

// ── OPGESLAGEN PANEL klikken ───────────────────────────────────────────────────
document.getElementById('opgeslagenPanel').addEventListener('click', e => {
  const bmBtn = e.target.closest('.bm-btn[data-bm-link]');
  if (bmBtn) {
    e.stopPropagation();
    const link = bmBtn.dataset.bmLink;
    const list = bmLoad();
    const idx2 = list.findIndex(a => a.link === link);
    if (idx2 >= 0) { list.splice(idx2, 1); localStorage.setItem(BMARK_KEY, JSON.stringify(list)); }
    renderOpgeslagen();
    document.querySelectorAll(`.bm-btn[data-bm-idx]`).forEach(btn => {
      const art = allArticles[parseInt(btn.dataset.bmIdx)];
      if (art && art.link === link) {
        btn.classList.remove('saved');
        btn.setAttribute('aria-label', 'Bewaar artikel');
        btn.innerHTML = bmIconHTML(false);
      }
    });
    return;
  }
  const card = e.target.closest('[data-bm-link]');
  if (!card || card.classList.contains('bm-btn')) return;
  const link = card.dataset.bmLink;
  const list = bmLoad();
  const art = list.find(a => a.link === link);
  if (art) openPopup(art);
});

// ── HEADER opgeslagen knop ─────────────────────────────────────────────────────
document.getElementById('opgeslagenHeaderBtn').addEventListener('click', e => {
  e.stopPropagation();
  document.querySelector('[data-tab="opgeslagen"]')?.click();
});

// ── POPUP ─────────────────────────────────────────────────────────────────────
let popupCurrentArt = null;

function openPopup(art) {
  popupCurrentArt = art;
  seenMark(seenKey(art));
  document.querySelectorAll(`[data-idx="${allArticles.indexOf(art)}"]`).forEach(el => el.classList.add('seen'));

  const clean = (art.desc || '').replace(/<[^>]*>/g, '').trim();
  document.getElementById('popupTitle').textContent = art.title;
  document.getElementById('popupDesc').textContent  = clean || 'Geen beschrijving beschikbaar.';
  document.getElementById('popupBtn').href          = art.link;

  const saved = bmHas(art);
  const popupBm = document.getElementById('popupBmBtn');
  popupBm.classList.toggle('saved', saved);
  popupBm.querySelector('.bm-add-icon').style.display    = saved ? 'none' : '';
  popupBm.querySelector('.bm-remove-icon').style.display = saved ? '' : 'none';

  document.getElementById('popupOverlay').classList.add('open');
  document.getElementById('popupSheet').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closePopup() {
  document.getElementById('popupOverlay').classList.remove('open');
  document.getElementById('popupSheet').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('popupOverlay').addEventListener('click', closePopup);
document.getElementById('popupSheet').addEventListener('click', e => e.stopPropagation());
document.getElementById('popupClose').addEventListener('click', e => { e.stopPropagation(); closePopup(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePopup(); });

let touchStartY = 0;
const sheet = document.getElementById('popupSheet');
sheet.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; }, { passive: true });
sheet.addEventListener('touchend', e => {
  if (e.changedTouches[0].clientY - touchStartY > 60) closePopup();
}, { passive: true });

// ── POPUP bookmark knop ────────────────────────────────────────────────────────
document.getElementById('popupBmBtn').addEventListener('click', e => {
  e.stopPropagation();
  if (!popupCurrentArt) return;
  const added = bmToggle(popupCurrentArt);
  const btn = document.getElementById('popupBmBtn');
  btn.classList.toggle('saved', added);
  btn.querySelector('.bm-add-icon').style.display    = added ? 'none' : '';
  btn.querySelector('.bm-remove-icon').style.display = added ? '' : 'none';
  const idx = allArticles.indexOf(popupCurrentArt);
  if (idx >= 0) {
    const feedBtn = document.querySelector(`.bm-btn[data-bm-idx="${idx}"]`);
    if (feedBtn) {
      feedBtn.classList.toggle('saved', added);
      feedBtn.setAttribute('aria-label', added ? 'Verwijder bladwijzer' : 'Bewaar artikel');
      feedBtn.innerHTML = bmIconHTML(added);
    }
  }
});

init();
</script>

<script>
// ── DESTEM ────────────────────────────────────────────────────────────────────
(function() {
  const btn           = document.getElementById('destemBtn');
  const overlay       = document.getElementById('destemOverlay');
  const sheet         = document.getElementById('destemSheet');
  const closeBtn      = document.getElementById('destemClose');
  const playBtn       = document.getElementById('destemPlayBtn');
  const rewindBtn     = document.getElementById('destemRewind');
  const forwardBtn    = document.getElementById('destemForward');
  const statusDiv     = document.getElementById('destemStatus');
  const statusText    = document.getElementById('destemStatusText');
  const spinner       = document.getElementById('destemSpinner');
  const controls      = document.getElementById('destemControls');
  const progressWrap  = document.getElementById('destemProgressWrap');
  const progressFill  = document.getElementById('destemProgressFill');
  const progressThumb = document.getElementById('destemProgressThumb');
  const timeCur       = document.getElementById('destemTimeCur');
  const timeTot       = document.getElementById('destemTimeTot');
  const timesEl       = document.getElementById('destemTimes');
  const scriptDiv     = document.getElementById('destemScript');
  const storiesDiv    = document.getElementById('destemStories');
  const storiesList   = document.getElementById('destemStoriesList');
  const expandRow     = document.getElementById('destemExpandRow');
  const dateLabel     = document.getElementById('destemDateLabel');
  const generateBtn   = document.getElementById('destemGenerateBtn');

  let audio = null, loaded = false, loading = false, rafId = null, activePanel = 'stories';
  const activeVoice = 'Aoede';

  function openSheet() {
    overlay.classList.add('open');
    sheet.classList.add('open');
    document.body.style.overflow = 'hidden';
    if (!loaded && !loading) loadBriefing();
  }
  function closeSheet() {
    overlay.classList.remove('open');
    sheet.classList.remove('open');
    document.body.style.overflow = '';
    btn.classList.remove('playing');
  }

  btn.addEventListener('click', openSheet);
  overlay.addEventListener('click', closeSheet);
  closeBtn.addEventListener('click', closeSheet);
  sheet.addEventListener('click', e => e.stopPropagation());

  generateBtn.addEventListener('click', () => {
    generateBtn.classList.add('spinning');
    generateBriefing(activeVoice);
    const stopSpin = setInterval(() => {
      if (!loading) { generateBtn.classList.remove('spinning'); clearInterval(stopSpin); }
    }, 500);
  });

  let _swipeY = 0;
  sheet.addEventListener('touchstart', e => { _swipeY = e.touches[0].clientY; }, { passive: true });
  sheet.addEventListener('touchend',   e => {
    if (e.changedTouches[0].clientY - _swipeY > 70) closeSheet();
  }, { passive: true });

  document.getElementById('destemExpandRow').addEventListener('click', e => {
    const tab = e.target.closest('[data-panel]');
    if (!tab) return;
    activePanel = tab.dataset.panel;
    document.querySelectorAll('.destem-expand-tab').forEach(t =>
      t.classList.toggle('active', t.dataset.panel === activePanel));
    storiesDiv.classList.toggle('visible', activePanel === 'stories');
    scriptDiv.classList.toggle('visible',  activePanel === 'script');
  });

  function applyMeta(data) {
    const d = new Date(data.date);
    dateLabel.textContent = d.toLocaleDateString('nl-BE', { weekday:'long', day:'numeric', month:'long' });
    if (Array.isArray(data.stories) && data.stories.length) renderStories(data.stories);
    else storiesList.innerHTML = '<p style="font-size:13px;color:var(--ink-faint);padding:8px 0">Geen verhalenlijst beschikbaar.</p>';
    if (data.script) scriptDiv.textContent = data.script;
    expandRow.classList.add('visible');
    storiesDiv.classList.add('visible');
    scriptDiv.classList.remove('visible');

    audio = new Audio(data.audioUrl);
    audio.preload = 'auto';
    audio.addEventListener('loadedmetadata', () => {
      timeTot.textContent        = fmt(audio.duration);
      statusDiv.style.display    = 'none';
      controls.style.display     = 'flex';
      progressWrap.style.display = 'block';
      timesEl.style.display      = 'flex';
      loaded = true; loading = false;
    });
    audio.addEventListener('ended', () => {
      playBtn.classList.remove('playing');
      btn.classList.remove('playing');
      cancelAnimationFrame(rafId);
    });
    audio.addEventListener('error', () => { setStatus('Audio kon niet worden afgespeeld.', false); loading = false; });
  }

  async function loadBriefing() {
    loading = true;
    setStatus('Briefing laden…', true);
    try {
      const res  = await fetch('/api/destem', { signal: AbortSignal.timeout(12000) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Onbekende fout');
      applyMeta(data);
    } catch (err) {
      const isNotReady = err.message.includes('404') || err.message.includes('Nog geen') || err.message.includes('not found');
      setStatus(isNotReady ? 'De ochtendbriefing is nog niet klaar. Kom na 06:00 terug.' : 'Kon briefing niet laden: ' + err.message, false);
      loading = false;
    }
  }

  function generateBriefing(voiceParam) {
    if (loading) return;
    loading = true; loaded = false;
    if (audio) { audio.pause(); audio = null; }
    playBtn.classList.remove('playing');
    btn.classList.remove('playing');
    cancelAnimationFrame(rafId);

    const url = '/api/destem-generate' + (voiceParam ? '?voice=' + voiceParam : '');
    const es  = new EventSource(url);

    es.addEventListener('status', e => {
      const d = JSON.parse(e.data);
      setStatus(d.message + (d.total ? ' (' + d.step + '/' + d.total + ')' : ''), true);
    });
    es.addEventListener('stories', e => {
      const d = JSON.parse(e.data);
      if (Array.isArray(d.stories) && d.stories.length) {
        renderStories(d.stories);
        expandRow.classList.add('visible');
        storiesDiv.classList.add('visible');
        scriptDiv.classList.remove('visible');
      }
    });
    es.addEventListener('done', e => {
      es.close();
      applyMeta(JSON.parse(e.data));
    });
    es.addEventListener('error', e => {
      es.close();
      let msg = 'Generatie mislukt';
      try { msg = JSON.parse(e.data).message || msg; } catch {}
      setStatus('⚠ ' + msg, false);
      loading = false;
    });
    es.onerror = () => {
      if (!loaded) { es.close(); setStatus('Verbinding verbroken. Probeer opnieuw.', false); loading = false; }
    };
  }

  const SOURCE_LABELS = { detijd:'De Tijd', standaard:'De Standaard', hln:'HLN', politico:'Politico', 'politico-opinion':'Politico Opinion' };

  function _esc(s) {
    return St
